[project]
name = "thuelang"
version = "0.5.0"
description = "Thue++ interpreter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-re2==1.1",
]

[project.scripts]
thue = "thuelang.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
