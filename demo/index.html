<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = localStorage.getItem('theme')
        var dark = theme !== 'light'
        if (theme === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body { margin: 0; height: 100%; }
      html { background: #0a0a0c; color: #e8e6e1; }
      html:not(.dark) { background: #f4f3ef; color: #1a1916; }
      #boot {
        min-height: 100%;
        display: grid;
        place-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #boot span {
        font-size: 28px;
        letter-spacing: 0.08em;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span { animation: none !important; opacity: 1; }
      }
    </style>
    <title>Thue++ — The safest, smallest, sandbox.</title>
    <meta
      name="description"
      content="The safest, smallest, sandbox."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://thuelang.org/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thue++" />
    <meta property="og:title" content="Thue++ — The safest, smallest, sandbox." />
    <meta
      property="og:description"
      content="The safest, smallest, sandbox."
    />
    <meta property="og:url" content="https://thuelang.org/" />
    <meta property="og:image" content="https://thuelang.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Thue++ — The safest, smallest, sandbox." />
    <meta
      name="twitter:description"
      content="The safest, smallest, sandbox."
    />

      }
    </script>
  </head>

</html>
