program = "../process.tpp"
timeout = 10

# Keep this shell command deliberately line-free: both implementations prefix
# process commands with `stdbuf -oL`, and this compact command exercises the
# documented --proc path without depending on host-specific newline quoting.
[bindings.procs]
worker = "sh -c 'printf proc-outputn; sleep 1'"

[expect]
stdout = "proc-outputn"
stderr = ""
exit_code = 0
