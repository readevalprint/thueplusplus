program = "../process.tpp"
timeout = 10

# Keep this shell command simple: both implementations prefix
# process commands with `stdbuf -oL`, and this compact command exercises the
# documented --proc path without depending on host-specific newline quoting.
[bindings.procs]
worker = "printf 'proc-outputn\\n'"

[expect]
stdout = "proc-outputn"
stderr = ""
exit_code = 0
