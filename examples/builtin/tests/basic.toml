program = "../builtin.tpp"
timeout = 5

[[case]]
name = "add replaces matched span"
input = "add:2,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "sub"
input = "sub:10,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "mul"
input = "mul:4,5"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "20"

[[case]]
name = "div exact rational"
input = "div:7,2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7/2"

[[case]]
name = "decimal arithmetic canonicalizes to rational"
input = "add:0.1,0.2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3/10"

[[case]]
name = "fraction arithmetic reduces"
input = "add:1/2,1/3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5/6"

[[case]]
name = "mixed decimal and fraction arithmetic"
input = "mul:1.5,2/3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "leading zeros are accepted and normalized"
input = "add:0001,02"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "negative zero is accepted and canonicalizes"
input = "add:-0.0,0/3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "fraction division reduces"
input = "div:1,2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1/2"

[[case]]
name = "division by zero fails loudly"
input = "div:1,0"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'div' division by zero"]

[[case]]
name = "mod"
input = "mod:20,6"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "mod rejects decimal inputs"
input = "mod:5.5,2"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' expected integer inputs"]

[[case]]
name = "mod rejects fraction inputs"
input = "mod:5/2,2"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' expected integer inputs"]

[[case]]
name = "mod accepts decimal operands that normalize to integers"
input = "mod:2.0,1.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "mod accepts fraction operands that normalize to integers"
input = "mod:4/2,1"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "mod rejects negative inputs"
input = "mod:-5,2"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' expected non-negative integer inputs"]

[[case]]
name = "numeric equality"
input = "numeq:1,1.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "rational equality normalizes"
input = "numeq:2/4,1/2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "string equality is exact"
input = "eq:1|1.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "lt"
input = "lt:2,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "rational comparison"
input = "lt:1/3,0.5"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "le equal"
input = "le:3,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "gt"
input = "gt:5,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "ge equal"
input = "ge:3,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "readable typed integer value"
input = "num:123"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<num>123</num>"

[[case]]
name = "readable typed decimal value canonicalizes"
input = "num:1.3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<num>13/10</num>"

[[case]]
name = "readable typed negative zero value canonicalizes"
input = "num:-0.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<num>0</num>"

[[case]]
name = "readable typed fraction value"
input = "num:2/3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<num>2/3</num>"

[[case]]
name = "modulo by zero fails loudly"
input = "mod:1,0"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' modulo by zero"]

[[case]]
name = "base64url encodes empty string"
input = "b64enc:"

[case.expect]
exit_code = 0
stderr = ""
stdout = ""

[[case]]
name = "base64url decodes empty string"
input = "b64dec:"

[case.expect]
exit_code = 0
stderr = ""
stdout = ""

[[case]]
name = "base64url encodes ascii text"
input = "b64enc:hello"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "aGVsbG8"

[[case]]
name = "base64url decodes ascii text"
input = "b64dec:aGVsbG8"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello"

[[case]]
name = "base64url encodes spaces and punctuation"
input = "b64enc:hello world!"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "aGVsbG8gd29ybGQh"

[[case]]
name = "base64url decodes spaces and punctuation"
input = "b64dec:aGVsbG8gd29ybGQh"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello world!"

[[case]]
name = "base64url encodes delimiter-like text"
input = "b64enc:<>{}()@ADD[1|2]@"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "PD57fSgpQEFERFsxfDJdQA"

[[case]]
name = "base64url decodes delimiter-like text"
input = "b64dec:PD57fSgpQEFERFsxfDJdQA"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<>{}()@ADD[1|2]@"

[[case]]
name = "base64url encodes quotes"
input = "b64enc:\"quotes\" and 'apos'"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "InF1b3RlcyIgYW5kICdhcG9zJw"

[[case]]
name = "base64url encodes unicode"
input = "b64enc:こんにちは"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "44GT44KT44Gr44Gh44Gv"

[[case]]
name = "base64url decodes unicode"
input = "b64dec:44GT44KT44Gr44Gh44Gv"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "こんにちは"

[[case]]
name = "safe internal string payload example"
input = "str:<str>@ADD[1|2]@</str>"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<str>PHN0cj5AQUREWzF8Ml1APC9zdHI-</str>"

[[case]]
name = "base64url decode rejects padding"
input = "b64dec:aGVsbG8="

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'b64dec' expected unpadded Base64url input"]

[[case]]
name = "base64url decode rejects invalid characters"
input = "b64dec:aGVsbG8+"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'b64dec' expected Base64url input"]

[[case]]
name = "base64url decode rejects impossible length"
input = "b64dec:A"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'b64dec' invalid Base64url length"]

[[case]]
name = "base64url decode rejects invalid utf8"
input = "b64dec:_w"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'b64dec' decoded bytes are not valid UTF-8"]
