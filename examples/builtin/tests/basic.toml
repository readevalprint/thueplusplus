program = "../builtin.tpp"
timeout = 5

[[case]]
name = "add replaces matched span"
input = "add:2,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "sub"
input = "sub:10,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "mul"
input = "mul:4,5"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "20"

[[case]]
name = "div decimal"
input = "div:7,2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3.5"

[[case]]
name = "mod"
input = "mod:20,6"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "mod rejects decimal inputs"
input = "mod:5.5,2"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' expected integer inputs"]

[[case]]
name = "mod rejects negative inputs"
input = "mod:-5,2"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'mod' expected non-negative integer inputs"]

[[case]]
name = "numeric equality"
input = "numeq:1,1.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "string equality is exact"
input = "eq:1|1.0"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "lt"
input = "lt:2,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "le equal"
input = "le:3,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "gt"
input = "gt:5,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "ge equal"
input = "ge:3,3"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "unknown builtin fails loudly"
program = "../bad-unknown.tpp"

[case.expect]
exit_code = 1
stderr_contains = ["Unknown builtin 'nope'"]

[[case]]
name = "wrong arity fails loudly"
program = "../bad-arity.tpp"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expects 2 args, got 1"]

[[case]]
name = "template arg spelling rejected"
program = "../bad-template-arg.tpp"

[case.expect]
exit_code = 1
stderr_contains = ["::! arguments must be capture names"]

[[case]]
name = "missing capture rejected"
program = "../bad-missing-capture.tpp"

[case.expect]
exit_code = 1
stderr_contains = ["::! argument 'b' is not a named capture"]
