program = "fixtures/parser-error-fixture.tpp"
timeout = 5

[[case]]
name = "fixture valid numeric path covers rule"
input = "parser-add:2,3"

[case.expect]
exit_code = 0
stderr = ""
stdout = ""

[[case]]
name = "scientific notation is rejected"
input = "parser-add:1e3,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '1e3'"]

[[case]]
name = "zero denominator fraction fails loudly"
input = "parser-add:2/0,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' fraction denominator must be non-zero"]

[[case]]
name = "zero denominator with leading zeros fails loudly"
input = "parser-add:2/00,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' fraction denominator must be non-zero"]

[[case]]
name = "signed denominator fraction is malformed"
input = "parser-add:2/-3,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '2/-3'"]

[[case]]
name = "signed zero denominator fraction is malformed"
input = "parser-add:2/-0,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '2/-0'"]

[[case]]
name = "double-signed fraction is malformed"
input = "parser-add:-2/-3,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '-2/-3'"]

[[case]]
name = "repeated slash number is malformed"
input = "parser-add:1/2/3,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '1/2/3'"]

[[case]]
name = "malformed decimal is rejected"
input = "parser-add:1.2.3,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '1.2.3'"]

[[case]]
name = "leading-dot decimal is malformed"
input = "parser-add:.5,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '.5'"]

[[case]]
name = "trailing-dot decimal is malformed"
input = "parser-add:5.,1"

[case.expect]
exit_code = 1
stderr_contains = ["Builtin 'add' expected numeric input, got '5.'"]
