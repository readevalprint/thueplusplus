program = "../pct.tpp"
timeout = 5

[[case]]
name = "pctenc builtin encodes unsafe bytes"
input = "enc:hello world;@"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello%20world%3B%40"

[[case]]
name = "pctdec builtin decodes canonical payload"
input = "dec:hello%20world%0A"

[case.expect]
exit_code = 0
stderr = ""
stdout = "hello world\n"

[[case]]
name = "data substitution encodes literal spaces"
input = "data:space"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello%20world"

[[case]]
name = "data substitution encodes replacement escapes"
input = "data:escape"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "a%0Ab"

[[case]]
name = "data substitution encodes literal percent"
input = "data:percent"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "100%25"

[[case]]
name = "data substitution treats encoded-looking text as text"
input = "data:encoded-looking"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "%2520"

[[case]]
name = "data substitution decodes captures once and re-encodes"
input = "join:hello%5Cnworld,done"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello%5Cnworld%2C%20done"

[[case]]
name = "line read produces PCT and pctdec filter writes output"
input = "read"

[bindings.procs]
input = "printf 'hello world @RULE@ {{x}}\n'"

[case.expect]
exit_code = 0
stderr = ""
stdout = "hello world @RULE@ {{x}}"
