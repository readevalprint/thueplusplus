program = "../pct.tpp"
timeout = 5

[[case]]
name = "pctenc builtin encodes unsafe bytes"
input = "enc:hello world;@"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello%20world%3B%40"

[[case]]
name = "pctdec builtin decodes canonical payload"
input = "dec:hello%20world%0A"

[case.expect]
exit_code = 0
stderr = ""
stdout = "hello world\n"

[[case]]
name = "line read produces PCT and pctdec filter writes output"
input = "read"

[bindings.pipes]
input = "printf 'hello world @RULE@ {{x}}\n'"

[case.expect]
exit_code = 0
stderr = ""
stdout = "hello world @RULE@ {{x}}"
