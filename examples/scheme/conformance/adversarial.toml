program = "../scheme.tpp"
timeout = 5
args = ["--max-evals", "60000"]

[[case]]
name = "truthiness treats empty list as true"
input = "(if () 1 2)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "truthiness treats only false as false"
input = "(if #f 1 2)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "fixed arity rejects too few arguments"
input = "((lambda (a b c) (+ a b c)) 1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "fixed arity rejects too many arguments"
input = "((lambda (a b c) (+ a b c)) 1 2 3 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[equivalence]]
name = "alpha-renamed two-argument addition is invariant"
inputs = [
  "((lambda (left right) (+ left right)) 4 5)",
  "((lambda (x y) (+ x y)) 4 5)",
]
[equivalence.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[equivalence]]
name = "alpha-renamed nested let and lambda are invariant"
inputs = [
  "(let ((a 10)) ((lambda (b) (+ a b)) 5))",
  "(let ((outer 10)) ((lambda (inner) (+ outer inner)) 5))",
]
[equivalence.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[equivalence]]
name = "shadowing keeps nearest binding independent of names"
inputs = [
  "(let ((a 10)) ((lambda (a) (+ a 1)) 3))",
  "(let ((outer 10)) ((lambda (inner) (+ inner 1)) 3))",
]
[equivalence.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[red]]
name = "closure-visible mutation remains explicit RED debt"
issue = "#272"
input = "(let ((x 1)) (let ((f (lambda () x))) (begin (set! x 2) (f))))"
[red.intended]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[red]]
name = "letrec recursive procedure remains explicit RED debt"
issue = "#247"
input = "(letrec ((f (lambda (n) (if (= n 0) 1 (* n (f (- n 1))))))) (f 4))"
[red.intended]
exit_code = 0
stderr = ""
stdout_stripped = "24"
