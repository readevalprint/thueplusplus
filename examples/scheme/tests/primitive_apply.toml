program = "../scheme.tpp"
timeout = 5
args = ["--max-evals", "60000"]

[[case]]
name = "zero argument addition returns additive identity through primitive apply"
input = "(+)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "n-ary addition folds every operand through primitive apply"
input = "(+ 1 2 3)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "addition type error is symmetric for first operand"
input = "(+ #t 1)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error"

[[case]]
name = "addition type error is symmetric for later operand"
input = "(+ 1 #t)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error"

[[case]]
name = "internal primitive value renders opaque"
input = "RET<VPRIM<add>|KDONE>"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#<primitive-procedure>"
