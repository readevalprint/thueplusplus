program = "../scheme.tpp"
timeout = 5
args = ["--max-evals", "60000"]

[[case]]
name = "line comment before datum is ignored"
input = "; ignored comment\n#t"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#t"

[[case]]
name = "escaped string renders canonically"
input = '"a\"b"'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = '"a\"b"'

[[case]]
name = "invalid string escape fails loud before host builtin"
input = '"bad\q"'
[case.expect]
exit_code = 2
stdout = ""
stderr = "invalid_string_escape"

[[case]]
name = "character literal single character"
input = "#\\a"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\a"

[[case]]
name = "character literal space name"
input = "#\\space"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\space"

[[case]]
name = "character literal newline name"
input = "#\\newline"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\newline"

[[case]]
name = "quoted dotted pair renders improper list syntax"
input = "'(1 . 2)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 . 2)"

[[case]]
name = "vector literal empty"
input = "#()"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#()"

[[case]]
name = "vector literal with scalar datums"
input = "#(1 2 #t)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#(1 2 #t)"

[[case]]
name = "character predicate true"
input = "(char? #\\space)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#t"

[[case]]
name = "character predicate false"
input = "(char? 'alpha)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#f"

[[case]]
name = "vector predicate true"
input = "(vector? #(1 2 #t))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#t"

[[case]]
name = "vector predicate false"
input = "(vector? #f)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#f"

[[case]]
name = "new predicates wrong arity"
input = "(char?)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "quoted list can contain character literal"
input = "'(#\\a 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(#\\a 1)"

[[case]]
name = "vector literal can contain character literal"
input = "#(#\\a 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#(#\\a 1)"

[[case]]
name = "vector literal can contain named character"
input = "#(#\\space)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#(#\\space)"

[[case]]
name = "null predicate accepts quoted empty list"
input = "(null? '())"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#t"

[[case]]
name = "pair predicate rejects quoted empty list"
input = "(pair? '())"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#f"

[[case]]
name = "quoted list can contain named character literal"
input = "'(#\\space)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(#\\space)"

[[case]]
name = "quoted list can contain newline character literal"
input = "'(#\\newline 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(#\\newline 1)"

[[case]]
name = "vector literal can contain newline character literal"
input = "#(#\\newline 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#(#\\newline 1)"
