exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "n-ary lambda checks too many arguments before extra body identifier"
input = "((lambda (a b c) (+ a b c missing)) 1 2 3 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "n-ary lambda accepts two unused trailing formals through arity drain"
input = "((lambda (a b c d e) (+ a b c)) 1 2 3 4 5)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "n-ary lambda rejects missing argument across arity drain"
input = "((lambda (a b c d e) (+ a b c)) 1 2 3 4)"
