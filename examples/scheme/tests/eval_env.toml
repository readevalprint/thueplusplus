[[case]]
name = "one-argument procedure definition identity rejects wrong call name"
input = "(define (id x) x)\n(other 8)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "one-argument procedure definition identity rejects zero arguments"
