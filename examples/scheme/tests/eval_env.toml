program = "../scheme.tpp"
timeout = 5
args = ["--max-evals", "60000"]

[[case]]
name = "lexical closure captures alpha-renamed outer binding"
input = "(let ((a 10)) ((lambda (b) (+ a b)) 5))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda parameter shadows alpha-renamed outer binding"
input = "(let ((a 10)) ((lambda (a) (+ a 1)) 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "let initializer uses alpha-renamed outer environment"
input = "(let ((a 1)) (let ((a 2) (b a)) (+ a b)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "let star initializer sees alpha-renamed previous binding"
input = "(let ((a 1)) (let* ((a 2) (b a)) (+ a b)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "nested lambda body if evaluates through argument binding"
input = "((lambda (x) (if #t x 0)) 9)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "lambda body unbound identifier fails through lookup"
input = "((lambda (x) (if #t y 0)) 9)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "lexical closure unbound alpha-renamed outer use fails"
input = "(let ((a 10)) ((lambda (b) (+ c b)) 5))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "lambda shadow body unbound alpha-renamed use fails"
input = "(let ((a 10)) ((lambda (b) (+ c 1)) 5))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "let initializer unbound alpha-renamed use fails"
input = "(let ((a 1)) (let ((a 2) (b c)) (+ a b)))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "let star initializer unbound alpha-renamed use fails"
input = "(let ((a 1)) (let* ((a 2) (b c)) (+ a b)))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "let set wrong alpha-renamed binding fails"
input = "(let ((a 1)) (begin (set! b 3) a))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_name"

[[case]]
name = "lambda application with too few arguments fails as wrong arity"
input = "((lambda (x) (+ x 1)))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "lambda application with too many arguments fails as wrong arity"
input = "((lambda (x) (+ x 1)) 4 5)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "applying a non-procedure number fails as type error"
input = "(1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error"

[[case]]
name = "procedure definition sugar applies one numeric argument"
input = "(define (add1 x) (+ x 1))\n(add1 4)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "procedure definition sugar rejects wrong arity"
input = "(define (add1 x) (+ x 1))\n(add1)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "procedure definition sugar body unbound parameter use fails"
input = "(define (add1 x) (+ y 1))\n(add1 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "procedure definition sugar rejects too many arguments"
input = "(define (add1 x) (+ x 1))\n(add1 4 5)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "procedure definition sugar unbound call name fails"
input = "(define (add1 x) (+ x 1))\n(inc 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "procedure definition sugar wrong arity unbound call name fails through lookup"
input = "(define (add1 x) (+ x 1))\n(inc)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument lambda adds alpha-renamed parameters"
input = "((lambda (left right) (+ left right)) 2 3)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "two-argument lambda mismatched first parameter fails"
input = "((lambda (left right) (+ other right)) 2 3)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument lambda mismatched second parameter fails"
input = "((lambda (left right) (+ left other)) 2 3)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument lambda too few arguments fails as wrong arity"
input = "((lambda (left right) (+ left right)) 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "two-argument lambda no arguments fails as wrong arity"
input = "((lambda (left right) (+ left right)))"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "two-argument lambda too many arguments fails as wrong arity"
input = "((lambda (left right) (+ left right)) 2 3 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "two-argument procedure definition applies numeric arguments"
input = "(define (add2 left right) (+ left right))\n(add2 4 5)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "two-argument procedure definition rejects wrong call name"
input = "(define (add2 left right) (+ left right))\n(sum2 4 5)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument procedure definition rejects zero-arg wrong call name through lookup"
input = "(define (add2 left right) (+ left right))\n(sum2)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument procedure definition rejects mismatched body name"
input = "(define (add2 left right) (+ left missing))\n(add2 4 5)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "two-argument procedure definition rejects too few arguments"
input = "(define (add2 left right) (+ left right))\n(add2 4)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "two-argument procedure definition rejects zero arguments"
input = "(define (add2 left right) (+ left right))\n(add2)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"

[[case]]
name = "two-argument procedure definition rejects too many arguments"
input = "(define (add2 left right) (+ left right))\n(add2 4 5 6)"
[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity"
