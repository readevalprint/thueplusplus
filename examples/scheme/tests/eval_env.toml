[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_identifier"

[[case]]
name = "n-ary lambda adds three alpha-renamed parameters through shared walker"
input = "((lambda (a b c) (+ a b c)) 1 2 3)"
