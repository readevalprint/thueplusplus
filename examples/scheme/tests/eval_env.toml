exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "two-argument procedure addition uses shared n-ary walker"
input = "(define (add2 left right) (+ left right))\n(add2 4 5)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

