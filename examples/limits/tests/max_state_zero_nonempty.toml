program = "../max-state-zero-nonempty.tpp"

[[case]]
name = "non-empty replacement is covered without zero limit"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "zero limit rejects non-empty replacement"
args = ["--max-state-bytes", "0"]

[case.expect]
exit_code = 1
stdout = ""
stderr_contains = ["State size (1 bytes) exceeds maximum (0 bytes)"]
