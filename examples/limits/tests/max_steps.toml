program = "../max-steps.thue"

[[case]]
name = "zero applied-step limit applies nothing"
args = ["--max-steps", "0"]

[case.expect]
exit_code = 10
stdout = ""
stderr = "Error: Applied step limit (0) exceeded\n"

[[case]]
name = "one applied step stops before the second rewrite"
args = ["--max-steps", "1"]

[case.expect]
exit_code = 10
stdout = ""
stderr = "Error: Applied step limit (1) exceeded\n"

[[case]]
name = "two applied steps stop before the write"
args = ["--max-steps", "2"]

[case.expect]
exit_code = 10
stdout = ""
stderr = "Error: Applied step limit (2) exceeded\n"

[[case]]
name = "three applied steps hit the limit after the write"
args = ["--max-steps", "3"]

[case.expect]
exit_code = 10
stdout = "done\n"
stderr = "Error: Applied step limit (3) exceeded\n"

[[case]]
name = "default applied-step limit runs to quiescence"

[case.expect]
exit_code = 0
stdout = "done\n"
stderr = ""

[[case]]
name = "unlimited applied-step limit runs to quiescence"
allow_unlimited = true
args = ["--max-steps", "unlimited"]

[case.expect]
exit_code = 0
stdout = "done\n"
stderr = ""
