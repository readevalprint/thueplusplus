# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 30
args = ["--eval-limit", "120000"]

[[case]]
name = "expr alias accepts nested list forms in dict values and renders recursively"
input = "(let () (write (unparse (dict ((quote outer) (dict ((quote inner) (list (quote <=) (list 1 2)))))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((outer ((inner (<= (1 2))))))"

[[case]]
name = "expr alias preserves evaluated index expressions for nth"
input = "(let () (write (unparse (nth (list 10 20 30 40) (add 1 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "40"

[[case]]
name = "quote symbol alias preserves multi character operator precedence"
input = "(let () (write (unparse (list (quote <=) (quote <) (quote >=) (quote >) (quote =)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(<= < >= > =)"

[[case]]
name = "quasiquote symbol alias preserves operator-like atoms"
input = "(let () (write (unparse (quasiquote (<= < >= > =)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(<= < >= > =)"

[[case]]
name = "dict key aliases keep string and symbol payloads distinct under update and delete"
input = "(let () (write (unparse (let ((d (assoc (dict ((quote x) 1) (\"x\" 2)) (quote x) 3))) (list (get d (quote x) 0) (get d \"x\" 0) (contains (dissoc d \"x\") (quote x)) (contains (dissoc d \"x\") \"x\"))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(3 2 true false)"

[[case]]
name = "no space pct alias still detects extra unquote arguments"
input = "(quasiquote (a (unquote (add 1 2) 3)))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "let value pct alias still preserves nested list binding values"
input = "(let () (write (unparse (let ((f (fn (x) (list x (quote ok))))) (f (list 1 2))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((1 2) ok)"

