program = "../lisp.tpp"
args = ["--max-evals", "120000"]

[[case]]
name = "set-nth replaces list index zero"
input = '(set-nth (list 1 2 3) 0 9)'
[case.expect]
stdout = "(9 2 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth replaces list index one"
input = '(set-nth (list 1 2 3) 1 9)'
[case.expect]
stdout = "(1 9 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth replaces list index two"
input = '(set-nth (list 1 2 3) 2 9)'
[case.expect]
stdout = "(1 2 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth replaces list index three"
input = '(set-nth (list 1 2 3 4) 3 9)'
[case.expect]
stdout = "(1 2 3 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth replaces arbitrary later index"
input = '(set-nth (list 0 1 2 3 4 5) 5 9)'
[case.expect]
stdout = "(0 1 2 3 4 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth replacement can be string symbol list dict closure and primitive"
input = '(list (set-nth (list 1 2) 0 "x") (set-nth (list 1 2) 0 (quote sym)) (set-nth (list 1 2) 0 (list 8 9)) (set-nth (list 1 2) 0 (dict ((quote k) 7))) (type (nth (set-nth (list 1 2) 0 (fn (x) x)) 0)) (type (nth (set-nth (list 1 2) 0 add) 0)))'
[case.expect]
stdout = "((\"x\" 2) (sym 2) ((8 9) 2) (((k 7)) 2) function builtin)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth empty list out of bounds"
input = '(set-nth (list) 0 9)'
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "set-nth short list out of bounds"
input = '(set-nth (list 1) 1 9)'
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "set-nth index four out of bounds"
input = '(set-nth (list 1 2 3) 4 9)'
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "set-nth negative index out of bounds"
input = '(set-nth (list 1 2 3) -1 9)'
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "set-nth fractional index type error"
input = '(set-nth (list 1 2 3) 1/2 9)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "set-nth decimal index type error"
input = '(set-nth (list 1 2 3) 1.0 9)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "top-level set-nth primitive is unparseable"
input = 'set-nth'
[case.expect]
stdout = ""
stderr_stripped = "unparseable_value"
exit_code = 2

[[case]]
name = "set-nth too few args wrong arity"
input = '(set-nth (list 1))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "set-nth too many args wrong arity"
input = '(set-nth (list 1) 0 9 10)'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "set-nth rejects non list receiver"
input = '(set-nth 42 0 9)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "set-nth treats helper-built alist as ordinary list"
input = '(set-nth (dict ((quote x) 1)) 0 9)'
[case.expect]
stdout = "(9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth rejects non numeric index"
input = '(set-nth (list 1) "0" 9)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "set-nth does not mutate existing list binding"
input = '(let ((xs (list 1 2 3))) (do (set-nth xs 1 9) xs))'
[case.expect]
stdout = "(1 2 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth result can be assigned with set-var"
input = '(let ((xs (list 1 2 3))) (do (set-var xs (set-nth xs 1 9)) xs))'
[case.expect]
stdout = "(1 9 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth preserves aliased old list value"
input = '(let ((xs (list 1 2))) (let ((ys xs)) (do (set-var xs (set-nth xs 0 9)) ys)))'
[case.expect]
stdout = "(1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth transforms quoted code callee"
input = '(set-nth (quote (add 1 2)) 0 (quote sub))'
[case.expect]
stdout = "(sub 1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "set-nth composes for nested quoted code"
input = '(let ((code (quote (add 1 (mul 2 3))))) (set-nth code 2 (set-nth (nth code 2) 2 10)))'
[case.expect]
stdout = "(add 1 (mul 2 10))\n"
stderr = ""
exit_code = 0
