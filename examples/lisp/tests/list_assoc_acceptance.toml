program = "../lisp.tpp"
args = ["--max-evals", "120000"]

[[case]]
name = "assoc replaces list index zero"
input = "(assoc (list 1 2 3) 0 9)"
[case.expect]
stdout = "(9 2 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replaces list index one"
input = "(assoc (list 1 2 3) 1 9)"
[case.expect]
stdout = "(1 9 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replaces list index two"
input = "(assoc (list 1 2 3) 2 9)"
[case.expect]
stdout = "(1 2 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replaces list index three"
input = "(assoc (list 1 2 3 4) 3 9)"
[case.expect]
stdout = "(1 2 3 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replaces arbitrary later index"
input = "(assoc (list 0 1 2 3 4 5) 5 9)"
[case.expect]
stdout = "(0 1 2 3 4 9)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replacement can be string symbol list dict closure and primitive"
input = "(list (assoc (list 1 2) 0 \"x\") (assoc (list 1 2) 0 (quote sym)) (assoc (list 1 2) 0 (list 8 9)) (assoc (list 1 2) 0 (dict (k 7))) (type (nth (assoc (list 1 2) 0 (fn (x) x)) 0)) (type (nth (assoc (list 1 2) 0 add) 0)))"
[case.expect]
stdout = "((\"x\" 2) (sym 2) ((8 9) 2) ((dict (k 7)) 2) function builtin)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc empty list out of bounds"
input = "(assoc (list) 0 9)"
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "assoc short list out of bounds"
input = "(assoc (list 1) 1 9)"
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "assoc index four out of bounds"
input = "(assoc (list 1 2 3) 4 9)"
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "assoc negative index out of bounds"
input = "(assoc (list 1 2 3) -1 9)"
[case.expect]
stdout = ""
stderr_stripped = "index_out_of_bounds"
exit_code = 2

[[case]]
name = "assoc fractional index type error"
input = "(assoc (list 1 2 3) 1/2 9)"
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "assoc decimal index type error"
input = "(assoc (list 1 2 3) 1.0 9)"
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "assoc no args wrong arity"
input = "(assoc)"
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "assoc too few args wrong arity"
input = "(assoc (list 1))"
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "assoc too many args wrong arity"
input = "(assoc (list 1) 0 9 10)"
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "assoc rejects non list receiver"
input = "(assoc 42 0 9)"
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "assoc rejects dict receiver"
input = "(assoc (dict (x 1)) 0 9)"
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "assoc rejects non numeric index"
input = "(assoc (list 1) \"0\" 9)"
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "assoc does not mutate existing list binding"
input = "(let ((xs (list 1 2 3))) (do (assoc xs 1 9) xs))"
[case.expect]
stdout = "(1 2 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc result can be assigned with set-var"
input = "(let ((xs (list 1 2 3))) (do (set-var xs (assoc xs 1 9)) xs))"
[case.expect]
stdout = "(1 9 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc preserves aliased old list value"
input = "(let ((xs (list 1 2))) (let ((ys xs)) (do (set-var xs (assoc xs 0 9)) ys)))"
[case.expect]
stdout = "(1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc transforms quoted code callee"
input = "(assoc (quote (add 1 2)) 0 (quote sub))"
[case.expect]
stdout = "(sub 1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc composes for nested quoted code"
input = "(let ((code (quote (add 1 (mul 2 3))))) (assoc code 2 (assoc (nth code 2) 2 10)))"
[case.expect]
stdout = "(add 1 (mul 2 10))\n"
stderr = ""
exit_code = 0
