program = "../lisp.tpp"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "symbol simple"
input = "'foo"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "'foo"

[[case]]
name = "symbol in list"
input = "(list 'a 'b 'c)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "('a . ('b . ('c . nil)))"

[[case]]
name = "symbol cons"
input = "(cons 'key 'value)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "('key . 'value)"

[[case]]
name = "eq symbols true"
input = "(eq 'foo 'foo)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "eq symbols false"
input = "(eq 'foo 'bar)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"
