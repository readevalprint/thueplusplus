program = "../lisp.tpp"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "lambda nested if"
input = "{{lambda {x} {if {gt $x 0} \"pos\" \"neg\"}} 5}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "pos"

[[case]]
name = "lambda nested if false"
input = "{{lambda {x} {if {gt $x 0} \"pos\" \"neg\"}} -5}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "neg"

[[case]]
name = "lambda nested arithmetic"
input = "{{lambda {x} {+ {* $x 2} 1}} 5}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "lambda double nested"
input = "{{lambda {x} {+ {* $x $x} {- $x 1}}} 3}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "lambda three params"
input = "{{lambda {x y z} {+ $x {+ $y $z}}} 1 2 3}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "lambda four params"
input = "{{lambda {a b c d} {+ $a {+ $b {+ $c $d}}}} 1 2 3 4}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "10"

[[case]]
name = "lambda five params"
input = "{{lambda {a b c d e} {+ $a {+ $b {+ $c {+ $d $e}}}}} 1 2 3 4 5}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda default used"
input = "{{lambda {{x 42}} $x}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "lambda default override"
input = "{{lambda {{x 0}} $x} 99}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "99"

[[case]]
name = "lambda default in expr"
input = "{{lambda {{x 10}} {+ $x 5}}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda in let called"
input = "{let {[f {lambda {x} {+ $x 10}}]} {$f 5}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda in let two params"
input = "{let {[add {lambda {a b} {+ $a $b}}]} {$add 3 4}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "char space named"
input = "#\\space"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\space"

[[case]]
name = "char newline named"
input = "#\\newline"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\newline"

[[case]]
name = "char tab named"
input = "#\\tab"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "#\\tab"
