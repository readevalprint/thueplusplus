# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "top-level empty list renders as reader syntax"
input = "(write (unparse (list)))"

[case.expect]
exit_code = 0
stdout_stripped = "()"
stderr = ""

[[case]]
name = "empty list first errors"
input = "(first (list))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "empty_list"

[[case]]
name = "singleton list rest is empty"
input = "(write (unparse (rest (list 7))))"

[case.expect]
exit_code = 0
stdout_stripped = "()"
stderr = ""

[[case]]
name = "nested let shadowing"
input = "(write (unparse (let ((x 1)) (let ((x 2)) x))))"

[case.expect]
exit_code = 0
stdout_stripped = "2"
stderr = ""

[[case]]
name = "closure captures outer binding after later shadow"
input = "(write (unparse (let ((x 10)) (let ((f (fn (y) (add x y)))) (let ((x 99)) (f 5))))))"

[case.expect]
exit_code = 0
stdout_stripped = "15"
stderr = ""

[[case]]
name = "apply fn from list first"
input = "(write (unparse ((first (list (fn (x) (add x 10)))) 5)))"

[case.expect]
exit_code = 0
stdout_stripped = "15"
stderr = ""

[[case]]
name = "nary and short circuits after false"
input = "(write (unparse (and true false (div 1 0))))"

[case.expect]
exit_code = 0
stdout_stripped = "false"
stderr = ""

[[case]]
name = "nary or returns first truthy value"
input = "(write (unparse (or false false 9)))"

[case.expect]
exit_code = 0
stdout_stripped = "9"
stderr = ""

[[case]]
name = "lazy if string protects syntax"
input = "(write (unparse (if true \"not (code) [x]\" (div 1 0))))"

[case.expect]
exit_code = 0
stdout_stripped = "\"not (code) [x]\""
stderr = ""

[[case]]
name = "rational addition"
input = "(write (unparse (add 1/2 1/3)))"

[case.expect]
exit_code = 0
stdout_stripped = "5/6"
stderr = ""

[[case]]
name = "unbound name inside addition errors"
input = "(add x 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"
