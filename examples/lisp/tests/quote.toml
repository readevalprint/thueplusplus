program = "../lisp.tpp"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "quote symbol"
input = "(quote foo)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "'(foo)"

[[case]]
name = "quote number"
input = "(quote 42)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "'(42)"


[[case]]
name = "quote nested arithmetic"
input = "(quote (+ 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "'(+ 1 2)"

[[case]]
name = "quote nested list form"
input = "(quote (list 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "'(list 1 2)"
