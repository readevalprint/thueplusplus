# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "literal int"
input = "(write (unparse 42))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "literal string"
input = "(write (unparse \"hello world\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"hello world\""

[[case]]
name = "literal bool"
input = "(write (unparse true))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "nested math"
input = "(write (unparse (add (add 1 (mul 2 3)) (add 4 5))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "16"

[[case]]
name = "compare"
input = "(write (unparse (eq (add 1 2) 3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "if lazy"
input = "(write (unparse (if (eq (add 1 2) 4) (div 1 0) 12)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "and lazy"
input = "(write (unparse (and false (div 1 0))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "or lazy"
input = "(write (unparse (or true (div 1 0))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "list mixed"
input = "(write (unparse (list 1 \"hi there\" false)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 \"hi there\" false)"

[[case]]
name = "first list"
input = "(write (unparse (first (list 8 9 10))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "rest list"
input = "(write (unparse (rest (list 8 \"x\" false))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"x\" false)"

[[case]]
name = "fn nary"
input = "(write (unparse ((fn (x y z) (add (add x y) z)) 1 2 3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "direct lambda call"
input = "(write (unparse ((fn (x) x) 1)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "direct no arg lambda call"
input = "(write (unparse ((fn () 1))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "fn closure"
input = "(write (unparse (((fn (x) (fn (y) (add x y))) 10) 5)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "fn shadow"
input = "(write (unparse ((fn (x) ((fn (x) x) 2)) 1)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "fn partial result is unparseable closure"
input = "((fn (x y) (add x y)) 1)"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "fn partial application completes"
input = "(write (unparse (((fn (x y) (add x y)) 1) 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "fn partial preserves lexical capture"
input = "(write (unparse (let ((a 10)) (((fn (x y) (add (add a x) y)) 1) 2))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "fn partial preserves shadowing"
input = "(write (unparse (let ((x 100)) (((fn (x y) (add x y)) 1) 2))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "fn partial too many args rejects"
input = "((fn (x y) (add x y)) 1 2 3)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "fn partial zero arg rejects"
input = "((fn (x) x))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "let list"
input = "(write (unparse (let ((xs (list 1 \"hi there\" 2))) (rest xs))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"hi there\" 2)"
