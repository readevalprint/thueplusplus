# Core acceptance cases for examples/lisp/lisp.tpp.
# Originally generated from learnings/hard_acceptance_cases.tsv, then promoted
# into the stable Lisp contract.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "literal int"
input = "42"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "literal string"
input = "\"hello world\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"hello world\""

[[case]]
name = "literal bool"
input = "true"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "nested math"
input = "(add (add 1 (mul 2 3)) (add 4 5))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "16"

[[case]]
name = "compare"
input = "(eq (add 1 2) 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "if lazy"
input = "(if (eq (add 1 2) 4) (div 1 0) 12)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "and lazy"
input = "(and false (div 1 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "or lazy"
input = "(or true (div 1 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "list mixed"
input = "(list 1 \"hi there\" false)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 \"hi there\" false)"

[[case]]
name = "head list"
input = "(head (list 8 9 10))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "tail list"
input = "(tail (list 8 \"x\" false))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"x\" false)"

[[case]]
name = "lambda nary"
input = "((lambda (x y z) (add (add x y) z)) 1 2 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "lambda closure"
input = "(((lambda (x) (lambda (y) (add x y))) 10) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda shadow"
input = "((lambda (x) ((lambda (x) x) 2)) 1)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "lambda partial renders closure"
input = "((lambda (x y) (add x y)) 1)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<closure>"

[[case]]
name = "lambda partial application completes"
input = "(((lambda (x y) (add x y)) 1) 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "lambda partial preserves lexical capture"
input = "(let ((a 10)) (((lambda (x y) (add (add a x) y)) 1) 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "lambda partial preserves shadowing"
input = "(let ((x 100)) (((lambda (x y) (add x y)) 1) 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "lambda partial too many args rejects"
input = "((lambda (x y) (add x y)) 1 2 3)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "lambda partial zero arg rejects"
input = "((lambda (x) x))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "let list"
input = "(let ((xs (list 1 \"hi there\" 2))) (tail xs))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"hi there\" 2)"

