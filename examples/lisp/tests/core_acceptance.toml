# Core acceptance cases for examples/lisp/lisp.tpp.
# Originally generated from learnings/hard_acceptance_cases.tsv, then promoted
# into the stable Lisp contract.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "literal int"
input = "42"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "literal string"
input = "\"hello world\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello world"

[[case]]
name = "literal bool"
input = "true"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "nested math"
input = "(+ 1 (* 2 3) (+ 4 5))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "16"

[[case]]
name = "compare"
input = "(= (+ 1 2) 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "if lazy"
input = "(if (= (+ 1 2) 4) (/ 1 0) 12)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "and lazy"
input = "(and false (/ 1 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "or lazy"
input = "(or true (/ 1 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "array mixed"
input = "(array 1 \"hi there\" false)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "[1 \"hi there\" false]"

[[case]]
name = "head array"
input = "(head (array 8 9 10))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "rest array"
input = "(rest (array 8 \"x\" false))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "[\"x\" false]"

[[case]]
name = "lambda nary"
input = "((lambda (x y z) (+ x y z)) 1 2 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "lambda closure"
input = "(((lambda (x) (lambda (y) (+ x y))) 10) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "lambda shadow"
input = "((lambda (x) ((lambda (x) x) 2)) 1)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "let array"
input = "(let ((xs (array 1 \"hi there\" 2))) (rest xs))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "[\"hi there\" 2]"

