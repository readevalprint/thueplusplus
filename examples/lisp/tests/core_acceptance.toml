# Core acceptance cases for examples/lisp/lisp.tpp.
# Originally generated from learnings/hard_acceptance_cases.tsv, then promoted
# into the stable Lisp contract.
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "literal int"
input = '42'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "literal string"
input = '"hello world"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"hello world\""

[[case]]
name = "literal bool"
input = 'true'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "nested math"
input = '(add (add 1 (mul 2 3)) (add 4 5))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "16"

[[case]]
name = "compare"
input = '(eq (add 1 2) 3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "if lazy"
input = '(if (eq (add 1 2) 4) (div 1 0) 12)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "and lazy"
input = '(and false (div 1 0))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "or lazy"
input = '(or true (div 1 0))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "list mixed"
input = '(list 1 "hi there" false)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 \"hi there\" false)"

[[case]]
name = "first list"
input = '(first (list 8 9 10))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "rest list"
input = '(rest (list 8 "x" false))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"x\" false)"

[[case]]
name = "fn nary"
input = '((fn (x y z) (add (add x y) z)) 1 2 3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "direct lambda call"
input = '((fn (x) x) 1)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "direct no arg lambda call"
input = '((fn () 1))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "fn closure"
input = '(((fn (x) (fn (y) (add x y))) 10) 5)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "fn shadow"
input = '((fn (x) ((fn (x) x) 2)) 1)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "fn partial result is unparseable closure"
input = '((fn (x y) (add x y)) 1)'

[case.expect]
exit_code = 2
stderr = "unparseable_value\n"
stdout_stripped = ""

[[case]]
name = "fn partial application completes"
input = '(((fn (x y) (add x y)) 1) 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "fn partial preserves lexical capture"
input = '(let ((a 10)) (((fn (x y) (add (add a x) y)) 1) 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "fn partial preserves shadowing"
input = '(let ((x 100)) (((fn (x y) (add x y)) 1) 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "fn partial too many args rejects"
input = '((fn (x y) (add x y)) 1 2 3)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "fn partial zero arg rejects"
input = '((fn (x) x))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "let list"
input = '(let ((xs (list 1 "hi there" 2))) (rest xs))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"hi there\" 2)"

