# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "write emits string and returns empty list"
input = "(let () (write (unparse (write \"Hello\"))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "Hello()"

[[case]]
name = "readline returns line without prompt"
input = "(let () (write (unparse (readline))))"
stdin = "plain text\n"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"plain text\""

[[case]]
name = "write composes with readline through zero-binding let"
input = "(let () (write (unparse (let () (write \"Name: \") (readline)))))"
stdin = "Ada\n"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "Name: \"Ada\""

[[case]]
name = "write and readline result can be assigned"
input = "(let () (write (unparse (let ((resp \"\")) (write \"Say: \") (set resp (readline)) resp))))"
stdin = "hello\n"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "Say: \"hello\""

[[case]]
name = "write requires string"
input = "(write 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error\n"

[[case]]
name = "readline rejects argument"
input = "(readline \"extra\")"
stdin = "ignored\n"

[case.expect]
exit_code = 2
stdout = ""
stderr = "wrong_arity\n"

[[case]]
name = "write without arguments is an uncalled primitive value"
input = "(write)"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "prompt name is not bound"
input = "(prompt \"Name: \")"
stdin = "ignored\n"

[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_name\n"

[[case]]
name = "input name is not bound"
input = "(input \"Name: \")"
stdin = "ignored\n"

[case.expect]
exit_code = 2
stdout = ""
stderr = "unbound_name\n"
