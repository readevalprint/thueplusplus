program = "../lisp.tpp"
timeout = 30
args = ["--eval-limit", "120000"]

[[case]]
name = "deeply nested let fn list application preserves lexical values"
input = "(write (unparse (let ((base 10)) (let ((mk (fn (x) (fn (y) (list base x y (list (add base x) (add x y))))))) (let ((base 99)) ((mk 2) 3))))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(10 2 3 (12 5))"
