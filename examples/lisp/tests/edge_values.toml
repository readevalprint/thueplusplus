# Former RED manifest now graduated for Lisp value-semantics edge cases.
# This file keeps value-semantics edge cases in the normal tests/ sweep so ordinary
# `examples/**/tests/*.toml` sweeps stay green while these desired behaviors are
# still being implemented.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "if rejects numeric condition"
input = "(if 0 1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "and rejects numeric lhs"
input = "(and 1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "or rejects numeric lhs"
input = "(or 0 (/ 1 0))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "if rejects string condition"
input = "(if \"\" 1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "if rejects array condition"
input = "(if (array) 1 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "direct nested array renders"
input = "(array 1 (array 2 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array 1 (array 2 3))"

[[case]]
name = "rest preserves nested array element"
input = "(rest (array 0 (array 1 2) 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array 1 2) 3)"

[[case]]
name = "array can render stored closure"
input = "(let ((f (lambda (x) x))) (array f))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array <closure>)"

[[case]]
name = "array can render stored closure after scalar"
input = "(let ((f (lambda (x) x))) (array 1 f))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array 1 <closure>)"

[[case]]
name = "lambda argument closure can be stored in array"
input = "((lambda (x) (array x)) (lambda (y) y))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array <closure>)"

[[case]]
name = "higher order closure stored in let can be applied later"
input = "(let ((mk (lambda (x) (lambda (y) (+ x y))))) ((mk 10) 5))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "returning closure from lambda preserves captured env"
input = "(((lambda (mk) (mk 10)) (lambda (x) (lambda (y) (+ x y)))) 5)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "string escape is preserved"
input = "\"a\\\"b\""
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = '"a\"b"'

[[case]]
name = "nested escaped string in selected if branch is preserved"
input = '(if true "a\"b" 0)'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = '"a\"b"'

[[case]]
name = "escaped string in unchosen if branch stays protected"
input = '(if true 1 "a\"b")'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "array renders nested escaped string"
input = '(array 1 "a\"b")'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = '(array 1 "a\"b")'

[[case]]
name = "lambda argument preserves computed array"
input = "((lambda (x) x) (array 1 2))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array 1 2)"

[[case]]
name = "array supports deeply nested computed arrays"
input = "(array (array (array 1)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 1)))"

[[case]]
name = "nested array can contain computed array after scalar"
input = "(array (array 0 (array 1)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array 0 (array 1)))"

[[case]]
name = "nonfirst nested array can start with computed array"
input = "(array 0 (array (array 1)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array 0 (array (array 1)))"

[[case]]
name = "nonfirst nested array can contain computed array after scalar"
input = "(array 0 (array 1 (array 2)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array 0 (array 1 (array 2)))"

[[case]]
name = "deep nested array can render boolean first"
input = "(array (array (array true)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array true)))"

[[case]]
name = "deep nested array can render string first"
input = '(array (array (array "x")))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array \"x\")))"

[[case]]
name = "deep nested array can render closure first"
input = "(array (array (array (lambda (x) x))))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array <closure>)))"

[[case]]
name = "deep nested array can render numeric second"
input = "(array (array (array 0 1)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 0 1)))"

[[case]]
name = "deep nested array can render boolean second"
input = "(array (array (array 0 true)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 0 true)))"

[[case]]
name = "deep nested array can render string second"
input = '(array (array (array 0 "x")))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 0 \"x\")))"

[[case]]
name = "deep nested array can render closure second"
input = "(array (array (array 0 (lambda (x) x))))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 0 <closure>)))"

[[case]]
name = "deep nested array can render computed array second"
input = "(array (array (array 0 (array 1))))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array 0 (array 1))))"

[[case]]
name = "deeper nested array can render computed array first"
input = "(array (array (array (array 1))))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(array (array (array (array 1))))"
