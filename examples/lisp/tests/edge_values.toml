# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "if rejects numeric condition"
input = "(if 0 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "and rejects numeric lhs"
input = "(and 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "or rejects numeric lhs"
input = "(or 0 (div 1 0))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "if rejects string condition"
input = "(if \"\" 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "if rejects list condition"
input = "(if (list) 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "direct nested list renders"
input = "(write (unparse (list 1 (list 2 3))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 (2 3))"

[[case]]
name = "rest preserves nested list element"
input = "(write (unparse (rest (list 0 (list 1 2) 3))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((1 2) 3)"

[[case]]
name = "list can render stored closure"
input = "(let ((f (fn (x) x))) (list f))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "list can render stored closure after scalar"
input = "(let ((f (fn (x) x))) (list 1 f))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "fn argument closure can be stored in list"
input = "((fn (x) (list x)) (fn (y) y))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "higher order closure stored in let can be applied later"
input = "(write (unparse (let ((mk (fn (x) (fn (y) (add x y))))) ((mk 10) 5))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "returning closure from fn preserves captured env"
input = "(write (unparse (((fn (mk) (mk 10)) (fn (x) (fn (y) (add x y)))) 5)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "string escape is preserved"
input = "(write (unparse \"a\\\"b\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\\"b\""

[[case]]
name = "nested escaped string in selected if branch is preserved"
input = "(write (unparse (if true \"a\\\"b\" 0)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\\"b\""

[[case]]
name = "escaped string in unchosen if branch stays protected"
input = "(write (unparse (if true 1 \"a\\\"b\")))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "list renders nested escaped string"
input = "(write (unparse (list 1 \"a\\\"b\")))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 \"a\\\"b\")"

[[case]]
name = "fn argument preserves computed list"
input = "(write (unparse ((fn (x) x) (list 1 2))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 2)"

[[case]]
name = "list supports deeply nested computed lists"
input = "(write (unparse (list (list (list 1)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((1)))"

[[case]]
name = "nested list can contain computed list after scalar"
input = "(write (unparse (list (list 0 (list 1)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((0 (1)))"

[[case]]
name = "nonfirst nested list can start with computed list"
input = "(write (unparse (list 0 (list (list 1)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 ((1)))"

[[case]]
name = "nonfirst nested list can contain computed list after scalar"
input = "(write (unparse (list 0 (list 1 (list 2)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (1 (2)))"

[[case]]
name = "deep nested list can render boolean first"
input = "(write (unparse (list (list (list true)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((true)))"

[[case]]
name = "deep nested list can render string first"
input = "(write (unparse (list (list (list \"x\")))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((\"x\")))"

[[case]]
name = "deep nested list can render closure first"
input = "(list (list (list (fn (x) x))))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "deep nested list can render numeric second"
input = "(write (unparse (list (list (list 0 1)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((0 1)))"

[[case]]
name = "deep nested list can render boolean second"
input = "(write (unparse (list (list (list 0 true)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((0 true)))"

[[case]]
name = "deep nested list can render string second"
input = "(write (unparse (list (list (list 0 \"x\")))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((0 \"x\")))"

[[case]]
name = "deep nested list can render closure second"
input = "(list (list (list 0 (fn (x) x))))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "deep nested list can render computed list second"
input = "(write (unparse (list (list (list 0 (list 1))))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(((0 (1))))"

[[case]]
name = "deeper nested list can render computed list first"
input = "(write (unparse (list (list (list (list 1))))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((((1))))"

[[case]]
name = "escaped backslash string renders round-trippable"
input = "(write (unparse \"a\\b\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\b\""

[[case]]
name = "escaped backslash in selected lazy branch renders round-trippable"
input = "(write (unparse (if true \"a\\b\" 0)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\b\""

[[case]]
name = "escaped backslash inside list renders round-trippable"
input = "(write (unparse (list \"a\\b\")))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"a\\b\")"

[[case]]
name = "newline escape string renders round-trippable"
input = "(write (unparse \"a\\nb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\nb\""

[[case]]
name = "tab escape string renders round-trippable"
input = "(write (unparse \"a\\tb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\tb\""

[[case]]
name = "carriage return escape string renders round-trippable"
input = "(write (unparse \"a\\rb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\rb\""

[[case]]
name = "backspace escape string renders round-trippable"
input = "(write (unparse \"a\\bb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\bb\""

[[case]]
name = "form feed escape string renders round-trippable"
input = "(write (unparse \"a\\fb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\fb\""

[[case]]
name = "newline escape inside list renders round-trippable"
input = "(write (unparse (list \"a\\nb\")))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"a\\nb\")"

[[case]]
name = "punctuation string escape is rejected by explicit string contract"
input = "\"a\\@b\""

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_string_escape"

[[case]]
name = "top-level unsupported string escape is rejected"
input = "\"a\\xb\""

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_string_escape"

[[case]]
name = "parse unsupported string escape is rejected"
input = "(parse \"\\\"a\\\\xb\\\"\")"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_string_escape"

[[case]]
name = "parse and unparse escaped newline remains round-trippable"
input = "(write (unparse (unparse (parse \"\\\"a\\\\nb\\\"\"))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"\\\"a\\\\nb\\\"\""

[[case]]
name = "strings with parentheses are protected before list freezing"
input = "(write (unparse (list \"a)b\" \"c(d\")))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(\"a)b\" \"c(d\")"

[[case]]
name = "escaped backslash before ordinary character renders round-trippable"
input = "(write (unparse \"a\\\\xb\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"a\\\\xb\""
