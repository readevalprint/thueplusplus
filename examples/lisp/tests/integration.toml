program = "../lisp.tpp"
timeout = 5



[[case]]
name = "factorial style"
input = "(* 3 (* 2 1))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "conditional arithmetic"
input = "(+ (if (gt 5 3) 10 0) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "list with computed values"
input = "(list (+ 1 2) (* 2 3) (- 10 5))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(3 . (6 . (5 . nil)))"

[[case]]
name = "let with all features"
input = "(let ([x 5] [y 3]) (if (gt $x $y) (+ $x $y) 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "boolean chain"
input = "(and (gt 5 3) (or (lt 1 2) (eq 0 1)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
