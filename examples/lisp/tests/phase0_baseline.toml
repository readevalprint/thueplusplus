# Reconciled with the BO Lisp direction.
# This manifest now contains only GREEN baseline literal behavior that is part of
# the current BO core. Legacy nil/internal-state/curly fail-loud expectations
# were either removed as out-of-scope (nil) or moved to debt_fail_loud_bo.toml.
program = "../lisp.tpp"
timeout = 5
args = ["--max-evals", "60000"]

[[case]]
name = "top level number"
input = "42"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "top level rational number"
input = "1/2"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1/2"

[[case]]
name = "top level true"
input = "true"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "top level false"
input = "false"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "top level string"
input = "\"hello world\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello world"
