program = "../lisp.tpp"
timeout = 5
args = ["--eval-limit", "60000"]

[[case]]
name = "top level number"
input = "(write (unparse 42))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "top level rational number"
input = "(write (unparse 1/2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1/2"

[[case]]
name = "top level true"
input = "(write (unparse true))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "top level false"
input = "(write (unparse false))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "top level string"
input = "(write (unparse \"hello world\"))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"hello world\""
