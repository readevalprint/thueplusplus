program = "../lisp.tpp"
timeout = 5

[[case]]
name = "add two"
input = "(+ 1 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "add three"
input = "(+ 1 (+ 2 3))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "sub"
input = "(- 10 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "mul"
input = "(* 4 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "20"

[[case]]
name = "div"
input = "(/ 20 4)"

[case.expect]
exit_code = 0
stderr = ""
stdout_startswith = "5"

[[case]]
name = "nested arithmetic"
input = "(+ (* 2 3) (- 10 5))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "deeply nested"
input = "(* (+ 1 2) (- (* 2 5) 3))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "21"

[[case]]
name = "decimal result"
input = "(/ 7 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7/2"

[[case]]
name = "rational intermediate multiplies"
input = "(* (/ 7 2) 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "fraction literals add"
input = "(+ 1/2 1/3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5/6"

[[case]]
name = "trailing dot numeric literal fails loudly"
input = "(+ 5. 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["parse error: unsupported or malformed Lisp input"]
