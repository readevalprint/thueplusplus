program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "begin single expression returns value"
input = "(begin (+ 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "begin returns final expression"
input = "(begin (+ 1 2) (+ 3 4) 9)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "begin evaluates earlier expressions before final"
input = "(begin (/ 1 0) 9)"

[case.expect]
exit_code = 2
stderr = "division_by_zero"
stdout = ""

[[case]]
name = "begin preserves lexical environment across sequence"
input = "(let ((x 4)) (begin (+ x 1) (+ x 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "begin selected by lazy if"
input = "(if true (begin (+ 1 2) (+ 3 4)) (/ 1 0))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "empty begin fails wrong arity"
input = "(begin)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""

[[case]]
name = "empty begin in lexical environment fails wrong arity"
input = "(let ((x 1)) (begin))"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""

[[case]]
name = "else keyword remains unsupported in if"
input = "(if true 1 else 2)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""
