program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "do single expression returns value"
input = '(do (add 1 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "do returns final expression"
input = '(do (add 1 2) (add 3 4) 9)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "do evaluates earlier expressions before final"
input = '(do (div 1 0) 9)'

[case.expect]
exit_code = 2
stderr = "division_by_zero"
stdout = ""

[[case]]
name = "do preserves lexical environment across sequence"
input = '(let ((x 4)) (do (add x 1) (add x 2)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "do selected by lazy if"
input = '(if true (do (add 1 2) (add 3 4)) (div 1 0))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "empty do fails wrong arity"
input = '(do)'

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""

[[case]]
name = "empty do in lexical environment fails wrong arity"
input = '(let ((x 1)) (do))'

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""

[[case]]
name = "else keyword remains unsupported in if"
input = '(if true 1 else 2)'

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout = ""
