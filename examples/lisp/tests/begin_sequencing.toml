# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "zero-binding let single expression returns value"
input = '(let () (add 1 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "zero-binding let returns final expression"
input = '(let () (add 1 2) (add 3 4) 9)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "zero-binding let evaluates earlier expressions before final"
input = '(let () (div 1 0) 9)'

[case.expect]
exit_code = 2
stderr = "division_by_zero\n"
stdout = ""

[[case]]
name = "let body preserves lexical environment across sequence"
input = '(let ((x 4)) (add x 1) (add x 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "zero-binding let selected by lazy if"
input = '(if true (let () (add 1 2) (add 3 4)) (div 1 0))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "empty do is unsupported"
input = '(do)'

[case.expect]
exit_code = 2
stderr = "unsupported_form\n"
stdout = ""

[[case]]
name = "empty do in lexical environment is unsupported"
input = '(let ((x 1)) (do))'

[case.expect]
exit_code = 2
stderr = "unsupported_form\n"
stdout = ""

[[case]]
name = "else keyword remains unsupported in if"
input = '(if true 1 else 2)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout = ""
