# Old public Lisp names are deliberately not compatibility aliases.
program = "../lisp.tpp"
timeout = 10

[[case]]
name = "old lambda form is unbound"
input = '(lambda (x) x)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old begin form is unbound"
input = '(begin 1 2)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old set form is unbound"
input = '(set x 1)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old head helper is unbound"
input = '(head (list 1 2))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old tail helper is unbound"
input = '(tail (list 1 2))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old empty question helper is unbound"
input = '(empty? (list))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old push helper is unbound"
input = '(push 0 (list 1))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old len helper is unbound"
input = '(len (list 1))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old at helper is unbound"
input = '(at (list 1) 0)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old lookup helper is unbound"
input = '(lookup (dict) (quote x) 0)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old has helper is unbound"
input = '(has (dict) (quote x))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old put helper is unbound"
input = '(put (dict) (quote x) 1)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "old del helper is unbound"
input = '(del (dict) (quote x))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"
