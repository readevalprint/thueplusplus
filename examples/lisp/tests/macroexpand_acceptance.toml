# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "160000"]

[[case]]
name = "macroexpand simple macro to code data"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (inc x)) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(add x 1)"

[[case]]
name = "macroexpand recursively expands nested macro calls"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (inc (inc x))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(add (add x 1) 1)"

[[case]]
name = "macroexpand recurses through non macro list children"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (list (inc x))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(list (add x 1))"

[[case]]
name = "macroexpand gives transformer raw operands"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote ignore)\n          (fn (args) 1)))))\n  (macroexpand (quote (ignore missing-name)) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "macroexpand recursively expands transformer output"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote a)\n          (fn (args) `(b ,(first args))))\n         ((quote b)\n          (fn (args) `(add ,(first args) 1))))))\n  (macroexpand (quote (a x)) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(add x 1)"

[[case]]
name = "macroexpand quote blocks expansion"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (quote (inc x))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(quote (inc x))"

[[case]]
name = "macroexpand quasiquote expands only unquote expression positions"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (quasiquote (template (inc data) (unquote (inc x))))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(quasiquote (template (inc data) (unquote (add x 1))))"

[[case]]
name = "macroexpand when macro uses splice and implicit sequence body"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote when)\n          (fn (args)\n            (let ((cond (first args))\n                  (body (rest args)))\n              `(if ,cond (let () ,@body) ())))))))\n  (macroexpand (quote (when ok (write \"yes\") 1)) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(if ok (let () (write \"yes\") 1) ())"

[[case]]
name = "macroexpand result can be evaluated explicitly"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (eval\n    (macroexpand (quote (inc 2)) macros)\n    (dict ((quote add) add))))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "macroexpand absent macro leaves call for later eval"
input = "(write (unparse (macroexpand (quote (inc 2)) (dict))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(inc 2)"

[[case]]
name = "macroexpand wrong arity none"
input = "(macroexpand)"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "macroexpand wrong arity one"
input = "(macroexpand (quote x))"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "macroexpand wrong arity extra"
input = "(macroexpand (quote x) (dict) (dict))"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "macroexpand macro scope must be a list"
input = "(macroexpand (quote x) 7)"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand macro key must be a symbol"
input = "(macroexpand (quote (inc x)) (dict (\"inc\" (fn (args) (first args)))))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand transformer must be callable"
input = "(macroexpand (quote (inc x)) (dict ((quote inc) 1)))"

[case.expect]
exit_code = 2
stderr = "not_function\n"
stdout_stripped = ""

[[case]]
name = "macroexpand transformer result must be code data"
input = "(let ((macros\n       (dict\n         ((quote bad)\n          (fn (args) add)))))\n  (macroexpand (quote (bad x)) macros))\n"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand scalar boolean returns unchanged"
input = "(write (unparse (macroexpand true (dict))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "macroexpand recurses list with non symbol head"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (1 (inc x))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 (add x 1))"

[[case]]
name = "macroexpand primitive transformer returns through normal apply"
input = "(write (unparse (macroexpand (quote (first (inc x))) (dict ((quote first) first)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(inc x)"

[[case]]
name = "macroexpand quasiquote preserves scalar and empty template data"
input = "(write (unparse (macroexpand (quote (quasiquote (1 true \"s\" ()))) (dict))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(quasiquote (1 true \"s\" ()))"

[[case]]
name = "macroexpand quasiquote expands splice expression positions"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (quasiquote (items (splice (inc xs))))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(quasiquote (items (splice (add xs 1))))"

[[case]]
name = "macroexpand quasiquote preserves nested quasiquote template"
input = "(write (unparse (let ((macros\n       (dict\n         ((quote inc)\n          (fn (args)\n            `(add ,(first args) 1))))))\n  (macroexpand (quote (quasiquote (quasiquote (inc x)))) macros))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(quasiquote (quasiquote (inc x)))"

[[case]]
name = "macroexpand macro scope entry must be a pair"
input = "(macroexpand (quote (inc x)) (list (list (quote inc))))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand macro scope entry must be a list"
input = "(macroexpand (quote (inc x)) (list 1))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand macro scope entry must be an exact pair"
input = "(macroexpand (quote (inc x)) (list (list (quote inc) (fn (args) (first args)) 3)))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand nested callable code value inside list is rejected"
input = "(macroexpand (list (quote list) add) (dict))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand code argument cannot be callable"
input = "(macroexpand (fn (x) x) (dict))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "macroexpand quasiquote template cannot contain callable values"
input = "(macroexpand (list (quote quasiquote) (list add)) (dict))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""
