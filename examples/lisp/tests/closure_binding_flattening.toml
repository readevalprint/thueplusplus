# Focused safety cases for the single closure binding iterator.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "zero arg closure call still evaluates body"
input = '((fn () 7))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "zero arg call to one-param closure rejects"
input = '((fn (x) x))'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "one arg closure binds parameter"
input = '((fn (x) x) 9)'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "n-ary closure binds left-to-right"
input = '((fn (x y z) (list x y z)) 1 2 3)'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 2 3)"

[[case]]
name = "too many args still rejects"
input = '((fn (x y) (add x y)) 1 2 3)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "partial application still returns opaque closure at top level"
input = '((fn (x y) (add x y)) 1)'
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unparseable_value"

[[case]]
name = "partial application still completes"
input = '(((fn (x y) (add x y)) 1) 2)'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "partial closure preserves lexical capture"
input = '(let ((a 10)) (((fn (x y) (add (add a x) y)) 1) 2))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "parameter shadows captured env"
input = '(let ((x 100)) ((fn (x) x) 1))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "partial application preserves parameter shadowing"
input = '(let ((x 100)) (((fn (x y) (add x y)) 1) 2))'
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"
