program = "../lisp.tpp"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "vector simple"
input = "#[1 2 3]"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "[1 2 3]"

[[case]]
name = "vector empty"
input = "#[]"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "[]"

[[case]]
name = "vec ref first"
input = "{vec-ref #[10 20 30] 0}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "10"

[[case]]
name = "vec ref middle"
input = "{vec-ref #[10 20 30] 1}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "20"

[[case]]
name = "vec ref last"
input = "{vec-ref #[10 20 30] 2}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "30"

[[case]]
name = "vec len empty"
input = "{vec-len #[]}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "0"

[[case]]
name = "vec len three"
input = "{vec-len #[1 2 3]}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "vec len one"
input = "{vec-len #[42]}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"
