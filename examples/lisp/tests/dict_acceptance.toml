# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 30
args = ["--eval-limit", "120000"]

[[case]]
name = "empty dict renders"
input = "(let () (write (unparse (dict))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "()"

[[case]]
name = "symbol key dict renders pair syntax"
input = "(let () (write (unparse (dict ((quote x) 1) ((quote y) 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 1) (y 2))"

[[case]]
name = "string key dict renders escaped pair syntax"
input = "(let () (write (unparse (dict (\"x\" 1) (\"line\\nkey\" 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((\"x\" 1) (\"line\\\\nkey\" 2))"

[[case]]
name = "dict values are evaluated"
input = "(let () (write (unparse (dict ((quote x) (add 1 2)) ((quote y) (list 4 5))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 3) (y (4 5)))"

[[case]]
name = "get symbol key returns stored value"
input = "(let () (write (unparse (get (dict ((quote x) 1) ((quote y) 2)) (quote x) 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "1"

[[case]]
name = "get string key returns stored value"
input = "(let () (write (unparse (get (dict (\"x\" 1) (\"y\" 2)) \"y\" 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "2"

[[case]]
name = "symbol and string keys with same payload are distinct"
input = "(let () (write (unparse (let ((d (dict ((quote x) 1) (\"x\" 2)))) (list (get d (quote x) 99) (get d \"x\" 99))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(1 2)"

[[case]]
name = "missing symbol key returns mandatory default"
input = "(let () (write (unparse (get (dict ((quote x) 1)) (quote missing) 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "99"

[[case]]
name = "present false does not fall through to default"
input = "(let () (write (unparse (get (dict ((quote x) false)) (quote x) true))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "false"

[[case]]
name = "get default is strict even when key is present"
input = "(get (dict ((quote x) 1)) (quote x) (div 1 0))"

[case.expect]
stdout = ""
stderr_stripped = "division_by_zero"
exit_code = 2

[[case]]
name = "get evaluates default when key is missing"
input = "(let () (write (unparse (get (dict ((quote x) 1)) (quote y) (add 40 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "42"

[[case]]
name = "get requires default"
input = "(get (dict ((quote x) 1)) (quote x))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "contains returns true for present symbol"
input = "(let () (write (unparse (contains (dict ((quote x) 1)) (quote x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "true"

[[case]]
name = "contains returns false for missing string"
input = "(let () (write (unparse (contains (dict (\"x\" 1)) \"y\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "false"

[[case]]
name = "contains distinguishes symbol from string"
input = "(let () (write (unparse (contains (dict ((quote x) 1)) \"x\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "false"

[[case]]
name = "assoc inserts new symbol key immutably"
input = "(let () (write (unparse (assoc (dict ((quote x) 1)) (quote y) 2))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((y 2) (x 1))"

[[case]]
name = "assoc replaces existing string key in place"
input = "(let () (write (unparse (assoc (dict (\"x\" 1) ((quote y) 2)) \"x\" 9))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((\"x\" 9) (y 2))"

[[case]]
name = "dissoc removes existing symbol key"
input = "(let () (write (unparse (dissoc (dict ((quote x) 1) ((quote y) 2)) (quote x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((y 2))"

[[case]]
name = "dissoc missing key is no op"
input = "(let () (write (unparse (dissoc (dict ((quote x) 1)) (quote y)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 1))"

[[case]]
name = "assoc returns new dict without changing original binding"
input = "(let () (write (unparse (let ((d (dict ((quote x) 1)))) (list (get (assoc d (quote y) 2) (quote y) 99) (get d (quote y) 99))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(2 99)"

[[case]]
name = "dissoc returns new dict without changing original binding"
input = "(let () (write (unparse (let ((d (dict ((quote x) 1) ((quote y) 2)))) (list (get (dissoc d (quote y)) (quote y) 99) (get d (quote y) 99))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(99 2)"

[[case]]
name = "duplicate symbol key is preserved"
input = "(let () (write (unparse (dict ((quote x) 1) ((quote x) 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 1) (x 2))"

[[case]]
name = "duplicate string key is preserved"
input = "(let () (write (unparse (dict (\"x\" 1) (\"x\" 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((\"x\" 1) (\"x\" 2))"

[[case]]
name = "malformed dict pair rejects missing value"
input = "(dict ((quote x)))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "malformed dict pair rejects extra value"
input = "(dict ((quote x) 1 2))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "dict accepts number key"
input = "(let () (write (unparse (dict (1 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((1 2))"

[[case]]
name = "get accepts number key and returns default on miss"
input = "(let () (write (unparse (get (dict ((quote x) 1)) 1 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "99"

[[case]]
name = "get skips non-list alist entry"
input = "(let () (write (unparse (get (list 1) (quote x) 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "99"

[[case]]
name = "assoc preserves non-list alist entries"
input = "(let () (write (unparse (assoc (list 1) (quote x) 2))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 2) 1)"

[[case]]
name = "dissoc accepts list key and no-ops on miss"
input = "(let () (write (unparse (dissoc (dict ((quote x) 1)) (list 1)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 1))"

[[case]]
name = "dict is not callable"
input = "((dict ((quote x) 1)) (quote x) 99)"

[case.expect]
stdout = ""
stderr_stripped = "not_function"
exit_code = 2

[[case]]
name = "empty dict through let renders"
input = "(let () (write (unparse (let ((d (dict))) d))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "()"

[[case]]
name = "dict rejects non pair entry"
input = "(dict x)"

[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "dict wrong arity in env"
input = "(let ((x 1)) (dict ((quote x) 1) extra))"

[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "contains skips non-list alist entry"
input = "(let () (write (unparse (contains (list 1) (quote x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "false"

[[case]]
name = "contains accepts number key and reports miss"
input = "(let () (write (unparse (contains (dict ((quote x) 1)) 1))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "false"

[[case]]
name = "assoc accepts number key"
input = "(let () (write (unparse (assoc (dict ((quote x) 1)) 1 2))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((1 2) (x 1))"

[[case]]
name = "dissoc preserves non-list alist entries"
input = "(let () (write (unparse (dissoc (list 1) (quote x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(1)"

[[case]]
name = "dissoc removes existing string key"
input = "(let () (write (unparse (dissoc (dict (\"x\" 1) ((quote y) 2)) \"x\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((y 2))"

[[case]]
name = "nth wrong arity in env"
input = "(let ((xs (list 1 2))) (nth xs))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2
