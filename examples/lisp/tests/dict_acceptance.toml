program = "../lisp.tpp"
args = ["--max-evals", "120000"]

[[case]]
name = "empty dict renders"
input = '(dict)'
[case.expect]
stdout = "()\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol key dict renders pair syntax"
input = '(dict ((quote x) 1) ((quote y) 2))'
[case.expect]
stdout = "((x 1) (y 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "string key dict renders escaped pair syntax"
input = '(dict ("x" 1) ("line\\nkey" 2))'
[case.expect]
stdout = "((\"x\" 1) (\"line\\nkey\" 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "dict values are evaluated"
input = '(dict ((quote x) (add 1 2)) ((quote y) (list 4 5)))'
[case.expect]
stdout = "((x 3) (y (4 5)))\n"
stderr = ""
exit_code = 0

[[case]]
name = "get symbol key returns stored value"
input = '(get (dict ((quote x) 1) ((quote y) 2)) (quote x) 99)'
[case.expect]
stdout = "1\n"
stderr = ""
exit_code = 0

[[case]]
name = "get string key returns stored value"
input = '(get (dict ("x" 1) ("y" 2)) "y" 99)'
[case.expect]
stdout = "2\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol and string keys with same payload are distinct"
input = '(let ((d (dict ((quote x) 1) ("x" 2)))) (list (get d (quote x) 99) (get d "x" 99)))'
[case.expect]
stdout = "(1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "missing symbol key returns mandatory default"
input = '(get (dict ((quote x) 1)) (quote missing) 99)'
[case.expect]
stdout = "99\n"
stderr = ""
exit_code = 0

[[case]]
name = "present false does not fall through to default"
input = '(get (dict ((quote x) false)) (quote x) true)'
[case.expect]
stdout = "false\n"
stderr = ""
exit_code = 0

[[case]]
name = "get default is strict even when key is present"
input = '(get (dict ((quote x) 1)) (quote x) (div 1 0))'
[case.expect]
stdout = ""
stderr_stripped = "division_by_zero"
exit_code = 2

[[case]]
name = "get evaluates default when key is missing"
input = '(get (dict ((quote x) 1)) (quote y) (add 40 2))'
[case.expect]
stdout = "42\n"
stderr = ""
exit_code = 0

[[case]]
name = "get requires default"
input = '(get (dict ((quote x) 1)) (quote x))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "contains returns true for present symbol"
input = '(contains (dict ((quote x) 1)) (quote x))'
[case.expect]
stdout = "true\n"
stderr = ""
exit_code = 0

[[case]]
name = "contains returns false for missing string"
input = '(contains (dict ("x" 1)) "y")'
[case.expect]
stdout = "false\n"
stderr = ""
exit_code = 0

[[case]]
name = "contains distinguishes symbol from string"
input = '(contains (dict ((quote x) 1)) "x")'
[case.expect]
stdout = "false\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc inserts new symbol key immutably"
input = '(assoc (dict ((quote x) 1)) (quote y) 2)'
[case.expect]
stdout = "((y 2) (x 1))\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc replaces existing string key in place"
input = '(assoc (dict ("x" 1) ((quote y) 2)) "x" 9)'
[case.expect]
stdout = "((\"x\" 9) (y 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc removes existing symbol key"
input = '(dissoc (dict ((quote x) 1) ((quote y) 2)) (quote x))'
[case.expect]
stdout = "((y 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc missing key is no op"
input = '(dissoc (dict ((quote x) 1)) (quote y))'
[case.expect]
stdout = "((x 1))\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc returns new dict without changing original binding"
input = '(let ((d (dict ((quote x) 1)))) (list (get (assoc d (quote y) 2) (quote y) 99) (get d (quote y) 99)))'
[case.expect]
stdout = "(2 99)\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc returns new dict without changing original binding"
input = '(let ((d (dict ((quote x) 1) ((quote y) 2)))) (list (get (dissoc d (quote y)) (quote y) 99) (get d (quote y) 99)))'
[case.expect]
stdout = "(99 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "duplicate symbol key is preserved"
input = '(dict ((quote x) 1) ((quote x) 2))'
[case.expect]
stdout = "((x 1) (x 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "duplicate string key is preserved"
input = '(dict ("x" 1) ("x" 2))'
[case.expect]
stdout = "((\"x\" 1) (\"x\" 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "malformed dict pair rejects missing value"
input = '(dict ((quote x)))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "malformed dict pair rejects extra value"
input = '(dict ((quote x) 1 2))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "dict accepts number key"
input = '(dict (1 2))'
[case.expect]
stdout = "((1 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "get accepts number key and returns default on miss"
input = '(get (dict ((quote x) 1)) 1 99)'
[case.expect]
stdout = "99\n"
stderr = ""
exit_code = 0

[[case]]
name = "get skips non-list alist entry"
input = '(get (list 1) (quote x) 99)'
[case.expect]
stdout = "99\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc preserves non-list alist entries"
input = '(assoc (list 1) (quote x) 2)'
[case.expect]
stdout = "((x 2) 1)\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc accepts list key and no-ops on miss"
input = '(dissoc (dict ((quote x) 1)) (list 1))'
[case.expect]
stdout = "((x 1))\n"
stderr = ""
exit_code = 0

[[case]]
name = "dict is not callable"
input = '((dict ((quote x) 1)) (quote x) 99)'
[case.expect]
stdout = ""
stderr_stripped = "not_function"
exit_code = 2

[[case]]
name = "empty dict through let renders"
input = '(let ((d (dict))) d)'
[case.expect]
stdout = "()\n"
stderr = ""
exit_code = 0

[[case]]
name = "dict rejects non pair entry"
input = '(dict x)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "dict wrong arity in env"
input = '(let ((x 1)) (dict ((quote x) 1) extra))'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "contains skips non-list alist entry"
input = '(contains (list 1) (quote x))'
[case.expect]
stdout = "false\n"
stderr = ""
exit_code = 0

[[case]]
name = "contains accepts number key and reports miss"
input = '(contains (dict ((quote x) 1)) 1)'
[case.expect]
stdout = "false\n"
stderr = ""
exit_code = 0

[[case]]
name = "assoc accepts number key"
input = '(assoc (dict ((quote x) 1)) 1 2)'
[case.expect]
stdout = "((1 2) (x 1))\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc preserves non-list alist entries"
input = '(dissoc (list 1) (quote x))'
[case.expect]
stdout = "(1)\n"
stderr = ""
exit_code = 0

[[case]]
name = "dissoc removes existing string key"
input = '(dissoc (dict ("x" 1) ((quote y) 2)) "x")'
[case.expect]
stdout = "((y 2))\n"
stderr = ""
exit_code = 0

[[case]]
name = "nth wrong arity in env"
input = '(let ((xs (list 1 2))) (nth xs))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2
