program = "../lisp.tpp"
args = ["--max-evals", "120000"]

[[case]]
name = "quasiquote scalar returns scalar data"
input = '(quasiquote 7)'
[case.expect]
stdout = "7\n"
stderr = ""
exit_code = 0

[[case]]
name = "quasiquote symbol returns symbol data"
input = '(quasiquote alpha)'
[case.expect]
stdout = "alpha\n"
stderr = ""
exit_code = 0

[[case]]
name = "quasiquote booleans and string return literal data"
input = '(list (quasiquote true) (quasiquote false) (quasiquote "qq"))'
[case.expect]
stdout = "(true false \"qq\")\n"
stderr = ""
exit_code = 0

[[case]]
name = "quasiquote list without unquote stays data"
input = '(quasiquote (+ 1 x))'
[case.expect]
stdout = "(+ 1 x)\n"
stderr = ""
exit_code = 0

[[case]]
name = "top-level unquote evaluates scalar expression in quasiquote"
input = '(quasiquote (unquote (add 1 2)))'
[case.expect]
stdout = "3\n"
stderr = ""
exit_code = 0

[[case]]
name = "top-level unquote wrong arity in quasiquote"
input = '(quasiquote (unquote 1 2))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "top-level empty unquote wrong arity in quasiquote"
input = '(quasiquote (unquote))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote evaluates scalar expression in quasiquote"
input = '(quasiquote (+ 1 (unquote (add 1 2))))'
[case.expect]
stdout = "(+ 1 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "unquote evaluates lexical name to symbol value"
input = '(let ((x (quote foo))) (quasiquote (call (unquote x))))'
[case.expect]
stdout = "(call foo)\n"
stderr = ""
exit_code = 0

[[case]]
name = "unquote can insert dynamic list as one item"
input = '(let ((xs (list 1 2))) (quasiquote (wrap (unquote xs) done)))'
[case.expect]
stdout = "(wrap (1 2) done)\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice inserts dynamic list elements in quasiquote"
input = '(let ((xs (list 1 2))) (quasiquote (do (splice xs) 3)))'
[case.expect]
stdout = "(do 1 2 3)\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice supports empty list"
input = '(let ((xs (list))) (quasiquote (do (splice xs) done)))'
[case.expect]
stdout = "(do done)\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice supports expression producing list"
input = '(quasiquote (a (splice (rest (list 0 1 2))) z))'
[case.expect]
stdout = "(a 1 2 z)\n"
stderr = ""
exit_code = 0

[[case]]
name = "unquote inside quoted nested list evaluates"
input = '(quasiquote (outer (inner (unquote (add 2 3)))))'
[case.expect]
stdout = "(outer (inner 5))\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice inside quoted nested list inserts into that list"
input = '(let ((xs (list (quote b) (quote c)))) (quasiquote (a (nested (splice xs) d))))'
[case.expect]
stdout = "(a (nested b c d))\n"
stderr = ""
exit_code = 0

[[case]]
name = "bare unquote remains unsupported"
input = '(unquote (add 1 2))'
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "bare splice remains unsupported"
input = '(splice (list 1 2))'
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "quasiquote no args wrong arity"
input = '(quasiquote)'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "quasiquote too many args wrong arity"
input = '(quasiquote 1 2)'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote no args in quasiquote wrong arity"
input = '(quasiquote (a (unquote)))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote no args before later quasiquote item wrong arity"
input = '(quasiquote ((unquote) a))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote too many args in quasiquote wrong arity"
input = '(quasiquote (a (unquote 1 2)))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice no args in quasiquote wrong arity"
input = '(quasiquote (a (splice)))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice no args before later quasiquote item wrong arity"
input = '(quasiquote ((splice) a))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice too many args in quasiquote wrong arity"
input = '(quasiquote (a (splice (list 1) (list 2))))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice non-list fails type error"
input = '(quasiquote (a (splice 1)))'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "nested quasiquote rejected"
input = '(quasiquote (outer (quasiquote inner)))'
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "splice nth top quasiquote item rejected"
input = '(quasiquote (splice (list 1 2)))'
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "top-level nested quasiquote rejected"
input = '(quasiquote (quasiquote inner))'
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "quasiquote wrong arity in lexical environment"
input = '(let ((x 1)) (quasiquote 1 2))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote returning set-var value propagates env in list item"
input = '(let ((x 1)) (do (quasiquote (a (unquote (set-var x 2)))) x))'
[case.expect]
stdout = "2\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice returning set-var list propagates env"
input = '(let ((xs (list 1)) (seen 0)) (do (quasiquote (a (splice (set-var xs (list 2 3))) z)) (count xs)))'
[case.expect]
stdout = "2\n"
stderr = ""
exit_code = 0

[[case]]
name = "splice returning set-var non-list fails type error"
input = '(let ((x 1)) (quasiquote (a (splice (set-var x 2)))))'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2
