# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 30
args = ["--eval-limit", "120000"]

[[case]]
name = "quasiquote number scalar returns scalar data"
input = "(let () (write (unparse (quasiquote 7))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "7"

[[case]]
name = "quasiquote bool scalar returns scalar data"
input = "(let () (write (unparse (quasiquote true))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "true"

[[case]]
name = "quasiquote symbol scalar returns symbol data"
input = "(let () (write (unparse (quasiquote alpha))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "alpha"

[[case]]
name = "quasiquote operator symbol scalar returns symbol data"
input = "(let () (write (unparse (quasiquote +))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "+"

[[case]]
name = "quasiquote string scalar returns literal data"
input = "(let () (write (unparse (quasiquote \"qq\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "\"qq\""

[[case]]
name = "quasiquote list without unquote stays data"
input = "(let () (write (unparse (quasiquote (+ 1 x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(+ 1 x)"

[[case]]
name = "top-level unquote evaluates scalar expression in quasiquote"
input = "(let () (write (unparse (quasiquote (unquote (add 1 2))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "3"

[[case]]
name = "top-level unquote wrong arity in quasiquote"
input = "(quasiquote (unquote 1 2))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "top-level empty unquote wrong arity in quasiquote"
input = "(quasiquote (unquote))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote evaluates scalar expression in quasiquote"
input = "(let () (write (unparse (quasiquote (+ 1 (unquote (add 1 2)))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(+ 1 3)"

[[case]]
name = "unquote evaluates lexical name to symbol value"
input = "(let () (write (unparse (let ((x (quote foo))) (quasiquote (call (unquote x)))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(call foo)"

[[case]]
name = "unquote can insert dynamic list as one item"
input = "(let () (write (unparse (let ((xs (list 1 2))) (quasiquote (wrap (unquote xs) done))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(wrap (1 2) done)"

[[case]]
name = "splice inserts dynamic list elements in quasiquote"
input = "(let () (write (unparse (let ((xs (list 1 2))) (quasiquote (do (splice xs) 3))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(do 1 2 3)"

[[case]]
name = "splice supports empty list"
input = "(let () (write (unparse (let ((xs (list))) (quasiquote (do (splice xs) done))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(do done)"

[[case]]
name = "splice supports expression producing list"
input = "(let () (write (unparse (quasiquote (a (splice (rest (list 0 1 2))) z)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(a 1 2 z)"

[[case]]
name = "unquote inside quoted nested list evaluates"
input = "(let () (write (unparse (quasiquote (outer (inner (unquote (add 2 3))))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(outer (inner 5))"

[[case]]
name = "splice inside quoted nested list inserts into that list"
input = "(let () (write (unparse (let ((xs (list (quote b) (quote c)))) (quasiquote (a (nested (splice xs) d)))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(a (nested b c d))"

[[case]]
name = "bare unquote remains unsupported"
input = "(unquote (add 1 2))"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "bare unquote scalar remains unsupported"
input = "(unquote 1)"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "bare splice remains unsupported"
input = "(splice (list 1 2))"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "quasiquote no args wrong arity"
input = "(quasiquote)"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "quasiquote too many args wrong arity"
input = "(quasiquote 1 2)"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote no args in quasiquote wrong arity"
input = "(quasiquote (a (unquote)))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote no args before later quasiquote item wrong arity"
input = "(quasiquote ((unquote) a))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote too many args in quasiquote wrong arity"
input = "(quasiquote (a (unquote 1 2)))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice no args in quasiquote wrong arity"
input = "(quasiquote (a (splice)))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice no args before later quasiquote item wrong arity"
input = "(quasiquote ((splice) a))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice too many args in quasiquote wrong arity"
input = "(quasiquote (a (splice (list 1) (list 2))))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "splice non-list fails type error"
input = "(quasiquote (a (splice 1)))"

[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "nested quasiquote rejected"
input = "(quasiquote (outer (quasiquote inner)))"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "splice nth top quasiquote item rejected"
input = "(quasiquote (splice (list 1 2)))"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "top-level nested quasiquote rejected"
input = "(quasiquote (quasiquote inner))"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "quasiquote wrong arity in lexical environment"
input = "(let ((x 1)) (quasiquote 1 2))"

[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "unquote returning set value propagates env in list item"
input = "(let () (write (unparse (let ((x 1)) (quasiquote (a (unquote (set x 2)))) x))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "2"

[[case]]
name = "splice returning set list propagates env"
input = "(let () (write (unparse (let ((xs (list 1)) (seen 0)) (quasiquote (a (splice (set xs (list 2 3))) z)) (count xs)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "2"

[[case]]
name = "splice returning set non-list fails type error"
input = "(let ((x 1)) (quasiquote (a (splice (set x 2)))))"

[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2
