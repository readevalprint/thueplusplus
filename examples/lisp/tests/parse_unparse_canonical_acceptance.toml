# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "200000"]

[[case]]
name = "unparse scalar number returns source string"
input = "(let () (write (unparse (unparse 42))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "\"42\""

[[case]]
name = "parse scalar number returns number"
input = "(let () (write (unparse (parse \"42\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "42"

[[case]]
name = "parse symbol returns symbol data"
input = "(let () (write (unparse (type (parse \"add\")))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "symbol"

[[case]]
name = "quoted primitive name remains symbol data"
input = "(let () (write (unparse (quote add))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "add"

[[case]]
name = "unparse quoted primitive name returns source string"
input = "(let () (write (unparse (unparse (quote add)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "\"add\""

[[case]]
name = "unparse quoted list returns parenthesized source string"
input = "(let () (write (unparse (unparse (quote (add 1 2))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "\"(add 1 2)\""

[[case]]
name = "parse list source returns list data without evaluation"
input = "(let () (write (unparse (first (parse \"(add 1 (div 1 0))\")))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "add"

[[case]]
name = "parse plus list can eval with explicit alist scope"
input = "(let () (write (unparse (eval (parse \"(add 1 2)\") (dict ((quote add) add))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "3"

[[case]]
name = "list helper output is canonical list syntax"
input = "(let () (write (unparse (list 1 2 3))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(1 2 3)"

[[case]]
name = "dict helper returns ordinary alist with evaluated keys"
input = "(let () (write (unparse (dict ((quote x) 1) (\"k\" 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 1) (\"k\" 2))"

[[case]]
name = "dict helper type is list"
input = "(let () (write (unparse (type (dict ((quote x) 1))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "list"

[[case]]
name = "dict helper evaluates value side"
input = "(let () (write (unparse (dict ((quote x) (add 1 2))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 3))"

[[case]]
name = "dict helper evaluates key side to string"
input = "(let () (write (unparse (let ((k \"dyn\")) (dict (k 7))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((\"dyn\" 7))"

[[case]]
name = "alist get finds symbol key"
input = "(let () (write (unparse (get (dict ((quote x) 1) (\"k\" 2)) (quote x) 0))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "1"

[[case]]
name = "alist get finds string key"
input = "(let () (write (unparse (get (dict ((quote x) 1) (\"k\" 2)) \"k\" 0))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "2"

[[case]]
name = "alist get missing returns default"
input = "(let () (write (unparse (get (dict ((quote x) 1)) (quote y) 99))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "99"

[[case]]
name = "alist contains reports present and missing"
input = "(let () (write (unparse (list (contains (dict ((quote x) 1)) (quote x)) (contains (dict ((quote x) 1)) (quote y))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(true false)"

[[case]]
name = "assoc updates first matching alist key"
input = "(let () (write (unparse (assoc (quote ((x 1) (x 2))) (quote x) 9))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((x 9) (x 2))"

[[case]]
name = "dissoc removes all matching alist keys"
input = "(let () (write (unparse (dissoc (quote ((x 1) (y 2) (x 3))) (quote x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((y 2))"

[[case]]
name = "loose alist get skips non-list entries"
input = "(let () (write (unparse (get (quote (x)) (quote x) 0))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "0"

[[case]]
name = "loose alist get skips empty list entries"
input = "(let () (write (unparse (get (quote (() (k v))) (quote k) (quote missing)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "v"

[[case]]
name = "loose alist get reads second item and ignores extra tail"
input = "(let () (write (unparse (get (quote ((k v1 v2) foo)) (quote k) (quote missing)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "v1"

[[case]]
name = "loose alist get skips key-only entries until value exists"
input = "(let () (write (unparse (get (quote ((k) (k v1))) (quote k) (quote missing)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "v1"

[[case]]
name = "loose alist get defaults for key-only entry"
input = "(let () (write (unparse (get (quote ((k))) (quote k) (quote missing)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "missing"

[[case]]
name = "loose alist contains sees key-only entry"
input = "(let () (write (unparse (contains (quote ((k))) (quote k)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "true"

[[case]]
name = "loose assoc preserves extra entry tail"
input = "(let () (write (unparse (assoc (quote ((k v1 v2) foo)) (quote k) (quote new)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((k new v2) foo)"

[[case]]
name = "loose assoc fills key-only entry"
input = "(let () (write (unparse (assoc (quote ((k) foo)) (quote k) (quote new)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((k new) foo)"

[[case]]
name = "loose assoc prepends on miss and preserves atoms"
input = "(let () (write (unparse (assoc (quote (foo)) (quote k) (quote v)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((k v) foo)"

[[case]]
name = "loose dissoc removes all matches and preserves atoms"
input = "(let () (write (unparse (dissoc (quote ((k v1) foo (k v2))) (quote k)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(foo)"

[[case]]
name = "dict allows duplicate keys and get uses first match"
input = "(let () (write (unparse (list (dict ((quote k) 1) ((quote k) 2)) (get (dict ((quote k) 1) ((quote k) 2)) (quote k) 0)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(((k 1) (k 2)) 1)"

[[case]]
name = "alist allows number and list keys"
input = "(let () (write (unparse (list (get (quote ((1 one))) 1 (quote missing)) (get (quote (((a) nested))) (quote (a)) (quote missing))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(one nested)"

[[case]]
name = "dict allows number and list keys"
input = "(let () (write (unparse (list (get (dict (1 (quote one))) 1 (quote missing)) (get (dict ((quote (a)) (quote nested))) (quote (a)) (quote missing))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(one nested)"

[[case]]
name = "alist exact key comparison keeps public values distinct"
input = "(let () (write (unparse (list (get (quote ((x sym) (\"x\" str))) (quote x) (quote missing)) (get (quote ((x sym) (\"x\" str))) \"x\" (quote missing)) (get (quote ((1 int) (1.0 decimal) (\"1\" string))) 1 (quote missing)) (get (quote ((1 int) (1.0 decimal) (\"1\" string))) 1.0 (quote missing)) (get (quote ((((a)) nested2) ((a) nested1))) (quote (a)) (quote missing))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(sym str int decimal nested1)"

[[case]]
name = "top level primitive value fails through unparse"
input = "add"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "top level closure value fails through unparse"
input = "(fn (x) x)"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "unparse primitive value fails"
input = "(unparse add)"

[case.expect]
stdout = ""
stderr_stripped = "unparseable_value"
exit_code = 2

[[case]]
name = "parse wrong type fails"
input = "(parse 1)"

[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2
