program = "../lisp.tpp"
timeout = 5



[[case]]
name = "simple string"
input = "\"hello\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello"

[[case]]
name = "string with spaces"
input = "\"hello world\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello world"

[[case]]
name = "empty string"
input = "\"\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = ""


[[case]]
name = "string with parentheses"
input = '"()"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "()"

[[case]]
name = "string with open parenthesis"
input = '"("'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "("

[[case]]
name = "string with close parenthesis"
input = '")"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = ")"


[[case]]
name = "string with entity-like text stays literal"
input = '"&lparen;"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "&lparen;"

[[case]]
name = "string with close entity-like text stays literal"
input = '"&rparen;"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "&rparen;"

[[case]]
name = "string with quote entity-like text stays literal"
input = '"&quot;"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "&quot;"

[[case]]
name = "string with ampersand entity-like text stays literal"
input = '"&amp;"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "&amp;"

[[case]]
name = "string equality handles plus punctuation"
input = '(eq "+" "+")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "string equality distinguishes plus and star punctuation"
input = '(eq "+" "*")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "string equality handles compound punctuation"
input = '(eq "a+b" "a+b")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "string equality distinguishes compound punctuation"
input = '(eq "a+b" "a*b")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "string equality handles delimiter-adjacent punctuation"
input = '(eq "@()[]=#" "@()[]=#")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "string with left brace literal"
input = '"{"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "{"

[[case]]
name = "string with right brace literal"
input = '"}"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "}"

[[case]]
name = "string equality handles brace literals"
input = '(eq "{}" "{}")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "string equality distinguishes brace literals"
input = '(eq "{" "}")'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"
