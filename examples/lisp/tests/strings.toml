program = "../lisp.tpp"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "simple string"
input = "\"hello\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello"

[[case]]
name = "string with spaces"
input = "\"hello world\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "hello world"

[[case]]
name = "empty string"
input = "\"\""

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = ""


[[case]]
name = "string with parentheses"
input = '"()"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "()"

[[case]]
name = "string with open parenthesis"
input = '"("'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "("

[[case]]
name = "string with close parenthesis"
input = '")"'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = ")"
