# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "empty let evaluates body in caller env"
input = "(write (unparse (let () 1)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "single let binding evaluates body"
input = "(write (unparse (let ((x 1)) x)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "later let binding sees earlier binding"
input = "(write (unparse (let ((x 1) (y x)) y)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "duplicate let name shadows left to right"
input = "(write (unparse (let ((x 1) (x 2)) x)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "self reference without outer binding is unbound"
input = "(let ((x x)) x)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "self reference uses outer binding before shadowing"
input = "(write (unparse (let ((x 1)) (let ((x x)) x))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "closure rhs does not capture its own let binding"
input = "(let ((x (fn (y) (if (gt y 0) (x (sub y 1)) y)))) (x 2))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"
