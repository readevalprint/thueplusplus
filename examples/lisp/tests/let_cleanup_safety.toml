# Focused deletion-first safety cases for the let binding-stream iterator.
# These pin sequential, non-recursive let semantics while KLETLAST is deleted.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "empty let evaluates body in caller env"
input = '(let () 1)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "single let binding evaluates body"
input = '(let ((x 1)) x)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "later let binding sees earlier binding"
input = '(let ((x 1) (y x)) y)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "duplicate let name shadows left to right"
input = '(let ((x 1) (x 2)) x)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "self reference without outer binding is unbound"
input = '(let ((x x)) x)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "self reference uses outer binding before shadowing"
input = '(let ((x 1)) (let ((x x)) x))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "closure rhs does not capture its own let binding"
input = '(let ((x (fn (y) (if (gt y 0) (x (sub y 1)) y)))) (x 2))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"
