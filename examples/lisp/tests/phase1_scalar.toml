# Reconciled with the canonical Lisp evaluator.
# This manifest keeps scalar behavior implemented by the canonical evaluator.
# Unsupported legacy scalar operators/comparisons remain out of scope;
# fail-loud gaps remain in fail_loud_debt.toml.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "binary addition"
input = '(add 1 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "too many addition operands fail loudly"
input = '(add 1 2 3)'

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "binary subtraction"
input = '(sub 5 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "binary multiplication"
input = '(mul 3 4)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "binary division returns rational"
input = '(div 7 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7/2"

[[case]]
name = "nested innermost arithmetic reduction"
input = '(mul (add 1 2) 4)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "rational addition"
input = '(add 1/2 1/3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5/6"

[[case]]
name = "rational result from division is consumed by later operation"
input = '(add (div 7 2) 1/2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "two inner frames collapse before outer frame with subtraction"
input = '(mul (add 1 2) (sub 7 3))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "outer comparison waits for inner arithmetic collapse"
input = '(eq (add 1 2) 3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality true"
input = '(eq 2 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality accepts decimal token"
input = '(eq 2 2.0)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality false"
input = '(eq 2 3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less than true"
input = '(lt 1 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "less than false"
input = '(lt 2 1)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less equal true on equality"
input = '(lte 2 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater than true"
input = '(gt 3 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater equal true on equality"
input = '(gte 3 3)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
