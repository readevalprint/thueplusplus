# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "binary addition"
input = "(write (unparse (add 1 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "too many addition operands fail loudly"
input = "(add 1 2 3)"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "binary subtraction"
input = "(write (unparse (sub 5 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "binary multiplication"
input = "(write (unparse (mul 3 4)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "binary division returns rational"
input = "(write (unparse (div 7 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7/2"

[[case]]
name = "nested innermost arithmetic reduction"
input = "(write (unparse (mul (add 1 2) 4)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "rational addition"
input = "(write (unparse (add 1/2 1/3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5/6"

[[case]]
name = "rational result from division is consumed by later operation"
input = "(write (unparse (add (div 7 2) 1/2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "two inner frames collapse before outer frame with subtraction"
input = "(write (unparse (mul (add 1 2) (sub 7 3))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "outer comparison waits for inner arithmetic collapse"
input = "(write (unparse (eq (add 1 2) 3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality true"
input = "(write (unparse (eq 2 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality accepts decimal token"
input = "(write (unparse (eq 2 2.0)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality false"
input = "(write (unparse (eq 2 3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less than true"
input = "(write (unparse (lt 1 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "less than false"
input = "(write (unparse (lt 2 1)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less equal true on equality"
input = "(write (unparse (lte 2 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater than true"
input = "(write (unparse (gt 3 2)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater equal true on equality"
input = "(write (unparse (gte 3 3)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
