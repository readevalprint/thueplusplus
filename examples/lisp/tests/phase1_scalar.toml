# Reconciled with the canonical Lisp evaluator.
# This manifest keeps scalar behavior implemented by the canonical evaluator.
# Unsupported legacy scalar operators/comparisons remain out of scope;
# fail-loud gaps remain in fail_loud_debt.toml.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "binary addition"
input = "(+ 1 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "nary addition"
input = "(+ 1 2 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "binary subtraction"
input = "(- 5 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "binary multiplication"
input = "(* 3 4)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "binary division returns rational"
input = "(/ 7 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7/2"

[[case]]
name = "nested innermost arithmetic reduction"
input = "(* (+ 1 2) 4)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "rational addition"
input = "(+ 1/2 1/3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5/6"

[[case]]
name = "rational result from division is consumed by later operation"
input = "(+ (/ 7 2) 1/2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "two inner frames collapse before outer frame with subtraction"
input = "(* (+ 1 2) (- 7 3))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "12"

[[case]]
name = "outer comparison waits for inner arithmetic collapse"
input = "(= (+ 1 2) 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality true"
input = "(= 2 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality accepts decimal token"
input = "(= 2 2.0)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "numeric equality false"
input = "(= 2 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less than true"
input = "(< 1 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "less than false"
input = "(< 2 1)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "less equal true on equality"
input = "(<= 2 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater than true"
input = "(> 3 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "greater equal true on equality"
input = "(>= 3 3)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
