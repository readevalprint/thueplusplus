program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "source state multiline indented nested math"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "15"

[[case]]
name = "input override multiline indented let body"
input = '''
(let (
  (x 2)
  (y (add 3 4))
)
  (add
    x
    (mul y 2)))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "16"

[[case]]
name = "parse trims leading newline source string"
input = '''(parse "
(add 1 2)")'''

[case.expect]
exit_code = 0
stderr = ""
stdout = "(add 1 2)\n"

[[case]]
name = "parse trims trailing newline source string"
input = '''(parse "(add 1 2)
")'''

[case.expect]
exit_code = 0
stderr = ""
stdout = "(add 1 2)\n"
