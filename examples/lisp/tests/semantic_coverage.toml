# Coverage-oriented manifest for supported Lisp evaluator paths.
# These cases exercise intended runtime paths beyond the minimal core acceptance
# suite, without weakening existing behavior.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "let subtraction uses lexical env"
input = "(let ((x 10)) (sub x 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "let multiplication uses lexical env"
input = "(let ((x 6)) (mul x 7))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "let multiplication nary uses lexical env"
input = "(let ((x 2)) (mul (mul x 3) 4))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "24"

[[case]]
name = "let division uses lexical env"
input = "(let ((x 8)) (div x 2))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "let division literal zero fails loudly"
input = "(let ((x 8)) (div x 0))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"

[[case]]
name = "let division bound zero fails loudly"
input = "(let ((x 8) (z 0)) (div x z))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"

[[case]]
name = "let numeric equality uses lexical env"
input = "(let ((x 2)) (eq x 2.0))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "let less-than uses lexical env"
input = "(let ((x 2)) (lt x 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "let less-or-equal uses lexical env"
input = "(let ((x 2)) (lte x 2))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "let greater-than uses lexical env"
input = "(let ((x 3)) (gt x 2))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "let greater-or-equal uses lexical env"
input = "(let ((x 3)) (gte x 3))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "env if true skips division by zero"
input = "(let ((x 1)) (if true x (div 1 0)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "env if false skips division by zero"
input = "(let ((x 1)) (if false (div 1 0) x))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "env and true returns rhs"
input = "(let ((x true)) (and x 9))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "env and false skips division by zero"
input = "(let ((x false)) (and x (div 1 0)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "env or true skips division by zero"
input = "(let ((x true)) (or x (div 1 0)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "env or false returns rhs"
input = "(let ((x false)) (or x 9))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "let list uses lexical env"
input = "(let ((x 1)) (list x false))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 false)"

[[case]]
name = "let head bound list"
input = "(let ((xs (list 4 5))) (head xs))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "4"

[[case]]
name = "let tail bound list"
input = "(let ((xs (list 4 5))) (tail xs))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(5)"

[[case]]
name = "list starts with boolean renderer"
input = "(list true 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(true 1)"

[[case]]
name = "lambda renders closure"
input = "(lambda (x) x)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "<closure>"

[[case]]
name = "env and literal true shortcut returns rhs"
input = "(let ((x 1)) (and true x))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "env and literal false shortcut skips rhs"
input = "(let ((x 1)) (and false (div 1 0)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "env nary and folds"
input = "(let ((x true)) (and x true 9))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "env or literal true shortcut skips rhs"
input = "(let ((x 1)) (or true (div 1 0)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "env or literal false shortcut returns rhs"
input = "(let ((x 1)) (or false x))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "env nary or folds"
input = "(let ((x false)) (or x false 9))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "single-item list evaluates child"
input = "(1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "top-level nary multiplication folds"
input = "(mul (mul 2 3) 4)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "24"

[[case]]
name = "env empty list literal"
input = "(let ((x 1)) (list))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "()"

[[case]]
name = "top-level computed and true returns rhs"
input = "(and (eq 1 1) 9)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "9"

[[case]]
name = "top-level computed or true skips rhs"
input = "(or (eq 1 1) (div 1 0))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "tail empty list through continuation"
input = "(tail (list))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "()"

[[case]]
name = "empty let evaluates body"
input = "(let () 1)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"



[[case]]
name = "env subtraction rejects boolean lhs"
input = "(let ((x true)) (sub x 1))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env subtraction rejects boolean rhs"
input = "(let ((x true)) (sub 1 x))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env multiplication rejects boolean lhs"
input = "(let ((x true)) (mul x 1))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env multiplication rejects boolean rhs"
input = "(let ((x true)) (mul 1 x))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env division rejects boolean lhs"
input = "(let ((x true)) (div x 1))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env division rejects boolean rhs"
input = "(let ((x true)) (div 1 x))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env division rational zero fails loudly"
input = "(let ((z 0/1)) (div 1 z))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"

[[case]]
name = "env less-than rejects boolean lhs"
input = "(let ((x true)) (lt x 1))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "env less-than rejects boolean rhs"
input = "(let ((x true)) (lt 1 x))"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "calling boolean is not function"
input = "(true 1)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "not_function"

[[case]]
name = "calling string is not function"
input = "(\"f\" 1)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "not_function"

[[case]]
name = "zero argument lambda rejects extra arg"
input = "((lambda () 1) 2)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "empty let with nested body"
input = "(let () (add 1 2))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "multi binding let with atomic body"
input = "(let ((x 1) (y 2)) x)"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "head rejects boolean"
input = "(head true)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "tail rejects boolean"
input = "(tail true)"
[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "nested list first boolean renders"
input = "(list (list true))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((true))"

[[case]]
name = "nested list first string renders"
input = "(list (list \"x\"))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((\"x\"))"

[[case]]
name = "nested list first closure renders"
input = "(list (list (lambda (x) x)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((<closure>))"

[[case]]
name = "nested list next boolean renders"
input = "(list (list 1 true))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((1 true))"

[[case]]
name = "nested list next string renders"
input = "(list (list 1 \"x\"))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((1 \"x\"))"

[[case]]
name = "nested list next closure renders"
input = "(list (list 1 (lambda (x) x)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((1 <closure>))"

[[case]]
name = "second nested list first boolean renders"
input = "(list 0 (list true))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (true))"

[[case]]
name = "second nested list first string renders"
input = "(list 0 (list \"x\"))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (\"x\"))"

[[case]]
name = "second nested list first closure renders"
input = "(list 0 (list (lambda (x) x)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (<closure>))"

[[case]]
name = "second nested list next boolean renders"
input = "(list 0 (list 1 true))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (1 true))"

[[case]]
name = "second nested list next string renders"
input = "(list 0 (list 1 \"x\"))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (1 \"x\"))"

[[case]]
name = "second nested list next closure renders"
input = "(list 0 (list 1 (lambda (x) x)))"
[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 (1 <closure>))"
