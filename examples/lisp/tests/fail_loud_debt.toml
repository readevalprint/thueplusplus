# Fail-loud debt manifest for unsupported or malformed Lisp inputs.
# These cases must not be silently accepted with rc 0 and empty output in the
# production Lisp evaluator. They track behavior that is intentionally rejected
# until a focused child card changes the language contract.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "raw internal-looking W state rejected"
input = "W:foo"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking B state rejected"
input = "B:foo"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking K state rejected"
input = "K:foo"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking O state rejected"
input = "O:foo"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "single curly syntax rejected"
input = "{+ 1 2}"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "malformed_list"

[[case]]
name = "double curly syntax rejected"
input = "{{+ 1 2}}"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "malformed_list"

[[case]]
name = "division by zero fails loudly"
input = "(/ 1 0)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"

[[case]]
name = "too few scalar operands fail loudly"
input = "(+ 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed numeric token fails loudly"
input = "(+ 1x 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_numeric_token"

[[case]]
name = "booleans are not accepted as numeric operands"
input = "(+ true 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "bang-prefixed input fails loudly"
input = "!boom"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "plus zero operands fail loudly"
input = "(+)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed second numeric token fails loudly"
input = "(+ 1 2x)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_numeric_token"

[[case]]
name = "boolean rhs is not accepted as numeric operand"
input = "(+ 1 true)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "leading name in nary plus fails loudly"
input = "(+ x 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "second name in nary plus fails loudly"
input = "(+ 1 x 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "second name in binary plus fails loudly"
input = "(+ 1 x)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "computed division by zero fails loudly"
input = "(/ 1 (- 1 1))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"


[[case]]
name = "bare unknown variable is an unbound name"
input = "missing"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "unsupported define form is not a lookup miss"
input = "(define x 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "unsupported letrec form is not a lookup miss"
input = "(letrec ((fact 1)) fact)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "malformed if with too few operands fails wrong arity"
input = "(if true 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed and with one operand fails wrong arity"
input = "(and true)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed or with one operand fails wrong arity"
input = "(or false)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed let without binding list fails wrong arity"
input = "(let 1 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed lambda without body fails wrong arity"
input = "(lambda (x))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "unknown callee remains an unbound name"
input = "(missing 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"


[[case]]
name = "malformed lambda in lexical environment fails wrong arity"
input = "(let ((x 1)) (lambda (x)))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"


[[case]]
name = "map constructor remains unsupported before map boundary"
input = "(map (quote x) 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "quasiquote remains downstream of quote list representation"
input = "(quasiquote (a b))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "bare unquote fails unsupported outside quasiquote"
input = "(unquote x)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"


[[case]]
name = "recursive let self reference remains an unbound name"
input = "(let ((fact (lambda (n) (if (= n 0) 1 (* n (fact (- n 1))))))) (fact 5))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "letrec factorial remains unsupported before recursion boundary"
input = "(letrec ((fact (lambda (n) (if (= n 0) 1 (* n (fact (- n 1))))))) (fact 5))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "lambda has no implicit self binding"
input = "(let ((f (lambda (n) (f n)))) (f 0))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "while remains unsupported before bounded loop policy"
input = "(while true 1)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"
