# SPDX-License-Identifier: AGPL-3.0-or-later
# Fail-loud debt manifest for unsupported or malformed Lisp inputs.
# These cases must not be silently accepted with rc 0 and empty output in the
# production Lisp evaluator. They track behavior that is intentionally rejected
# until a focused child card changes the language contract.
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "raw internal-looking W state rejected"
input = 'W:foo'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking B state rejected"
input = 'B:foo'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking K state rejected"
input = 'K:foo'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "raw internal-looking O state rejected"
input = 'O:foo'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "single curly syntax rejected"
input = '{+ 1 2}'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "malformed_list"

[[case]]
name = "double curly syntax rejected"
input = '{{+ 1 2}}'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "malformed_list"

[[case]]
name = "division by zero fails loudly"
input = '(div 1 0)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"

[[case]]
name = "too few scalar operands fail loudly"
input = '(add 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed numeric token fails loudly"
input = '(add 1x 2)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_numeric_token"

[[case]]
name = "booleans are not accepted as numeric operands"
input = '(add true 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "bang-prefixed input fails loudly"
input = '!boom'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "malformed second numeric token fails loudly"
input = '(add 1 2x)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "invalid_numeric_token"

[[case]]
name = "boolean rhs is not accepted as numeric operand"
input = '(add 1 true)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "leading name in nary plus fails loudly"
input = '(add x 1 2)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "second name in nary plus fails loudly"
input = '(add 1 x 2)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "second name in binary plus fails loudly"
input = '(add 1 x)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "computed division by zero fails loudly"
input = '(div 1 (sub 1 1))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "division_by_zero"


[[case]]
name = "bare unknown variable is an unbound name"
input = 'missing'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "unsupported define form is not a get miss"
input = '(define x 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "unsupported letrec form is not a get miss"
input = '(letrec ((fact 1)) fact)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "malformed if with too few operands fails wrong arity"
input = '(if true 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed and with one operand fails wrong arity"
input = '(and true)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed or with one operand fails wrong arity"
input = '(or false)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed let without binding list fails wrong arity"
input = '(let 1 2)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "malformed fn without body fails wrong arity"
input = '(fn (x))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "unknown callee remains an unbound name"
input = '(missing 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"


[[case]]
name = "malformed fn in lexical environment fails wrong arity"
input = '(let ((x 1)) (fn (x)))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"


[[case]]
name = "map constructor remains unsupported before map boundary"
input = '(map (quote x) 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "bare unquote fails unsupported outside quasiquote"
input = '(unquote x)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"


[[case]]
name = "recursive let self reference remains an unbound name"
input = '(let ((fact (fn (n) (if (eq n 0) 1 (mul n (fact (sub n 1))))))) (fact 5))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

[[case]]
name = "letrec factorial remains unsupported before recursion boundary"
input = '(letrec ((fact (fn (n) (if (eq n 0) 1 (mul n (fact (sub n 1))))))) (fact 5))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unsupported_form"

[[case]]
name = "fn contains no implicit self binding"
input = '(let ((f (fn (n) (f n)))) (f 0))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"
