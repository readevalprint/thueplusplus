program = "../lisp.w"
timeout = 5

[bindings.procs]
calc = "bc -lq"

[requires]
commands = ["bc"]

[[case]]
name = "cons"
input = "{cons 1 2}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 . 2)"

[[case]]
name = "car"
input = "{car {cons 1 2}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "cdr"
input = "{cdr {cons 1 2}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "list single"
input = "{list 1}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 . nil)"

[[case]]
name = "list multiple"
input = "{list 1 2 3}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 . (2 . (3 . nil)))"

[[case]]
name = "nested cons"
input = "{car {cons {+ 1 1} 3}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "car of list"
input = "{car {list 1 2 3}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "cdr of list"
input = "{cdr {list 1 2 3}}"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(2 . (3 . nil))"
