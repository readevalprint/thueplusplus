program = "../lisp.tpp"
timeout = 5



[[case]]
name = "lambda identity"
input = "((lambda (x) $x) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "lambda arithmetic"
input = "((lambda (x) (+ $x 1)) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "lambda two params"
input = "((lambda (x y) (+ $x $y)) 3 4)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "lambda nested call"
input = "((lambda (x) (* $x $x)) (+ 2 3))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "25"

[[case]]
name = "lambda double"
input = "((lambda (x) (+ $x $x)) 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "10"

[[case]]
name = "lambda return value"
input = "(lambda (x) $x)"

[case.expect]
exit_code = 0
stderr = ""
stdout_contains = ["[lambda x]"]
