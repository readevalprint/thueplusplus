# Builtins are ordinary callable values resolved through the lexical environment.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "80000"]

[[case]]
name = "named add uses core env"
input = "(add 1 2)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "named nested arithmetic"
input = "(add 1 (mul 2 3))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "named comparisons"
input = "(and (eq (add 1 2) 3) (lte 2 2) (gt 5 4))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "primitive callable wrong arity too few"
input = "(add 1)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "primitive callable wrong arity too many"
input = "(add 1 2 3)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "primitive callable type error"
input = "(add 1 true)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable shadowed by number is not callable"
input = "(let ((add 7)) (add 1 2))"

[case.expect]
exit_code = 2
stderr = "not_function"
stdout_stripped = ""

[[case]]
name = "primitive callable shadowed by closure"
input = "(let ((add (lambda (x y) 999))) (add 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "999"

[[case]]
name = "missing callee is lookup miss"
input = "(missing 1 2)"

[case.expect]
exit_code = 2
stderr = "unbound_name"
stdout_stripped = ""

[[case]]
name = "symbolic operator hard cutoff"
input = "(+ 1 2)"

[case.expect]
exit_code = 2
stderr = "unsupported_form"
stdout_stripped = ""

[[case]]
name = "primitive callable value renders opaquely inside list"
input = "(list add)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(<primitive>)"

[[case]]
name = "primitive callable value rejected by head as non-list"
input = "(head add)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by tail as non-list"
input = "(tail add)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by len as non-list"
input = "(len add)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by at as non-list"
input = "(at add 0)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by push as non-list"
input = "(push 1 add)"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by quasiquote splice as non-list"
input = "(quasiquote (x (splice add)))"

[case.expect]
exit_code = 2
stderr = "type_error"
stdout_stripped = ""

[[case]]
name = "collection len is env callable"
input = "(len (list 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "collection len shadowed by number is not callable"
input = "(let ((len 7)) (len (list 1)))"

[case.expect]
exit_code = 2
stderr = "not_function"
stdout_stripped = ""

[[case]]
name = "eval receives len as explicit capability"
input = "(eval (quote (len xs)) (dict (len len) (xs (list 1 2))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "eval without len capability fails unbound"
input = "(eval (quote (len xs)) (dict (xs (list 1 2))))"

[case.expect]
exit_code = 2
stderr = "unbound_name"
stdout_stripped = ""

[[case]]
name = "eval receives has as explicit capability"
input = "(eval (quote (has d k)) (dict (has has) (d (dict (a 42))) (k (quote a))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "callable empty predicate remains public"
input = "(empty? (list))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "callable at remains public"
input = "(at (list 7 8) 1)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "callable push remains public"
input = "(push 0 (list 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 1 2)"

[[case]]
name = "callable lookup too few args fails wrong arity"
input = "(lookup (dict) (quote a))"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "callable len too many args fails wrong arity"
input = "(len (list 1) (list 2))"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "eval receives lookup as explicit capability"
input = "(eval (quote (lookup d k z)) (dict (lookup lookup) (d (dict (a 42))) (k (quote a)) (z 0)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "callable head no args fails wrong arity"
input = "(head)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "callable push too many args fails wrong arity"
input = "(push 0 (list 1) 2)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""

[[case]]
name = "callable lookup too many args fails wrong arity"
input = "(lookup (dict) (quote a) 0 1)"

[case.expect]
exit_code = 2
stderr = "wrong_arity"
stdout_stripped = ""
