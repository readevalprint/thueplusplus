# SPDX-License-Identifier: AGPL-3.0-or-later
# Builtins are ordinary callable values resolved through the lexical environment.
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "80000"]

[[case]]
name = "named add uses core env"
input = '(add 1 2)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "named nested arithmetic"
input = '(add 1 (mul 2 3))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "named comparisons"
input = '(and (eq (add 1 2) 3) (lte 2 2) (gt 5 4))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "primitive callable wrong arity too few"
input = '(add 1)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "primitive callable wrong arity too many"
input = '(add 1 2 3)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "primitive callable type error"
input = '(add 1 true)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable shadowed by number is not callable"
input = '(let ((add 7)) (add 1 2))'

[case.expect]
exit_code = 2
stderr = "not_function\n"
stdout_stripped = ""

[[case]]
name = "primitive name shadowed by number evaluates binding"
input = '(let ((add 1)) add)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "primitive callable shadowed by closure"
input = '(let ((add (fn (x y) 999))) (add 1 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "999"

[[case]]
name = "missing callee is get miss"
input = '(missing 1 2)'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "symbolic operator hard cutoff"
input = '(+ 1 2)'

[case.expect]
exit_code = 2
stderr = "unsupported_form\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value inside list is unparseable"
input = '(list add)'

[case.expect]
exit_code = 2
stderr = "unparseable_value\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by first as non-list"
input = '(first add)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by rest as non-list"
input = '(rest add)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by count as non-list"
input = '(count add)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by nth as non-list"
input = '(nth add 0)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by cons as non-list"
input = '(cons 1 add)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "primitive callable value rejected by quasiquote splice as non-list"
input = '(quasiquote (x (splice add)))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "collection count is env callable"
input = '(count (list 1 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "collection count shadowed by number is not callable"
input = '(let ((count 7)) (count (list 1)))'

[case.expect]
exit_code = 2
stderr = "not_function\n"
stdout_stripped = ""

[[case]]
name = "eval receives count as explicit capability"
input = '(eval (quote (count xs)) (dict ((quote count) count) ((quote xs) (list 1 2))))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "2"

[[case]]
name = "eval receives count as explicit capability for long list"
input = '(eval (quote (count xs)) (dict ((quote count) count) ((quote xs) (list 1 2 3 4 5 6))))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "6"

[[case]]
name = "eval receives nth as explicit capability for arbitrary index"
input = '(eval (quote (nth xs i)) (dict ((quote nth) nth) ((quote xs) (list 9 8 7 6 5)) ((quote i) 4)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "5"

[[case]]
name = "eval without count capability fails unbound"
input = '(eval (quote (count xs)) (dict ((quote xs) (list 1 2))))'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval receives contains as explicit capability"
input = '(eval (quote (contains d k)) (dict ((quote contains) contains) ((quote d) (dict ((quote a) 42))) ((quote k) (quote a))))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "callable empty predicate remains public"
input = '(is-empty (list))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "callable nth remains public"
input = '(nth (list 7 8) 1)'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "8"

[[case]]
name = "callable cons remains public"
input = '(cons 0 (list 1 2))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(0 1 2)"

[[case]]
name = "callable get too few args fails wrong arity"
input = '(get (dict) (quote a))'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "callable count too many args fails wrong arity"
input = '(count (list 1) (list 2))'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval receives get as explicit capability"
input = '(eval (quote (get d k z)) (dict ((quote get) get) ((quote d) (dict ((quote a) 42))) ((quote k) (quote a)) ((quote z) 0)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "top-level first primitive is unparseable"
input = 'first'

[case.expect]
exit_code = 2
stderr = "unparseable_value\n"
stdout_stripped = ""

[[case]]
name = "callable cons too many args fails wrong arity"
input = '(cons 0 (list 1) 2)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "callable get too many args fails wrong arity"
input = '(get (dict) (quote a) 0 1)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""
