# Exact routing for special-form arity and unsupported-form catchers. These
# cases pin public errors so cleanup cannot drift into unbound_name,
# not_function, or the wrong fail-loud class.
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "bare eval fails wrong arity"
input = '(eval)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "eval with one operand fails wrong arity"
input = '(eval (quote x))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "eval with three operands fails wrong arity"
input = '(eval (quote x) (list) 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "bare quote fails wrong arity"
input = '(quote)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "quote with two operands fails wrong arity"
input = '(quote x y)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "wrong_arity"

[[case]]
name = "bare quasiquote fails wrong arity"
input = '(quasiquote)'

