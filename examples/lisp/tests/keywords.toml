program = "../lisp.tpp"
timeout = 5


[requires]
commands = ["bc"]

[[case]]
name = "keyword simple"
input = ":foo"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = ":foo"

[[case]]
name = "keyword in list"
input = "(list :a :b :c)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(:a . (:b . (:c . nil)))"

[[case]]
name = "eq keywords true"
input = "(eq :foo :foo)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "eq keywords false"
input = "(eq :foo :bar)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"
