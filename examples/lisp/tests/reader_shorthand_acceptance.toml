# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "200000"]

[[case]]
name = "quote shorthand returns symbol literal"
input = "(let () (write (unparse 'a)))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "a"

[[case]]
name = "quote shorthand returns list data without applying callee"
input = "(let () (write (unparse '(<= 1 2))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(<= 1 2)"

[[case]]
name = "quote shorthand works inside evaluated lists"
input = "(let () (write (unparse (let ((x 'a)) (dict (x x))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((a a))"

[[case]]
name = "parse quote shorthand returns canonical quote form data"
input = "(let () (write (unparse (parse \"'a\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(quote a)"

[[case]]
name = "parse quoted list shorthand returns canonical quote form data"
input = "(let () (write (unparse (parse \"'(1 2 a)\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(quote (1 2 a))"

[[case]]
name = "quasiquote shorthand evaluates unquote expression"
input = "(let () (write (unparse `(1 ,(add 1 2) 4))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(1 3 4)"

[[case]]
name = "quasiquote shorthand splices list expression with existing splice form"
input = "(let () (write (unparse `(a ,@(list 1 2) b))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(a 1 2 b)"

[[case]]
name = "parse quasiquote shorthand returns canonical quasiquote data"
input = "(let () (write (unparse (parse \"`(1 ,x)\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(quasiquote (1 (unquote x)))"

[[case]]
name = "parse bare comma shorthand returns canonical unquote data"
input = "(let () (write (unparse (parse \",x\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(unquote x)"

[[case]]
name = "parse bare comma splice shorthand returns canonical splice data"
input = "(let () (write (unparse (parse \",@xs\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(splice xs)"

[[case]]
name = "top level bare comma shorthand preserves existing unsupported unquote boundary"
input = ",x"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "unquote splicing long name remains ordinary quasiquote data"
input = "(let () (write (unparse (quasiquote ((unquote-splicing xs))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "((unquote-splicing xs))"

[[case]]
name = "reader shorthand characters inside strings are inert"
input = "(let () (write (unparse (list \"'a\" \"`x\" \",x\" \",@x\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(\"'a\" \"`x\" \",x\" \",@x\")"

[[case]]
name = "comma splice with no datum fails loudly"
input = ",@"

[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2
