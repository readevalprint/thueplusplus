# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "200000"]

[[case]]
name = "quote shorthand returns symbol literal"
input = "'a"
[case.expect]
stdout = "a\n"
stderr = ""
exit_code = 0

[[case]]
name = "quote shorthand returns list data without applying callee"
input = "'(<= 1 2)"
[case.expect]
stdout = "(<= 1 2)\n"
stderr = ""
exit_code = 0

[[case]]
name = "quote shorthand works inside evaluated lists"
input = "(let ((x 'a)) (dict (x x)))"
[case.expect]
stdout = "((a a))\n"
stderr = ""
exit_code = 0

[[case]]
name = "parse quote shorthand returns canonical quote form data"
input = '''(parse "'a")'''
[case.expect]
stdout = "(quote a)\n"
stderr = ""
exit_code = 0

[[case]]
name = "parse quoted list shorthand returns canonical quote form data"
input = '''(parse "'(1 2 a)")'''
[case.expect]
stdout = "(quote (1 2 a))\n"
stderr = ""
exit_code = 0

[[case]]
name = "quasiquote shorthand evaluates unquote expression"
input = '''`(1 ,(add 1 2) 4)'''
[case.expect]
stdout = "(1 3 4)\n"
stderr = ""
exit_code = 0

[[case]]
name = "quasiquote shorthand splices list expression with existing splice form"
input = '''`(a ,@(list 1 2) b)'''
[case.expect]
stdout = "(a 1 2 b)\n"
stderr = ""
exit_code = 0

[[case]]
name = "parse quasiquote shorthand returns canonical quasiquote data"
input = '''(parse "`(1 ,x)")'''
[case.expect]
stdout = "(quasiquote (1 (unquote x)))\n"
stderr = ""
exit_code = 0

[[case]]
name = "parse bare comma shorthand returns canonical unquote data"
input = '''(parse ",x")'''
[case.expect]
stdout = "(unquote x)\n"
stderr = ""
exit_code = 0

[[case]]
name = "parse bare comma splice shorthand returns canonical splice data"
input = '''(parse ",@xs")'''
[case.expect]
stdout = "(splice xs)\n"
stderr = ""
exit_code = 0

[[case]]
name = "top level bare comma shorthand preserves existing unsupported unquote boundary"
input = ",x"
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2

[[case]]
name = "unquote splicing long name remains ordinary quasiquote data"
input = "(quasiquote ((unquote-splicing xs)))"
[case.expect]
stdout = "((unquote-splicing xs))\n"
stderr = ""
exit_code = 0

[[case]]
name = "reader shorthand characters inside strings are inert"
input = '''(list "'a" "`x" ",x" ",@x")'''
[case.expect]
stdout = "(\"'a\" \"`x\" \",x\" \",@x\")\n"
stderr = ""
exit_code = 0

[[case]]
name = "comma splice with no datum fails loudly"
input = ''',@'''
[case.expect]
stdout = ""
stderr_stripped = "unsupported_form"
exit_code = 2
