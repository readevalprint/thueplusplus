program = "../lisp.tpp"
timeout = 5

# These cases intentionally seed canonical internal states. They are shared
# Python/Go fixtures used only to cover fail-loud guards and continuation
# rewrites that public Lisp syntax cannot always isolate directly.

[[case]]
name = "raw quote marker without frames"
input = "W:@Qabc@\nS:\nO:"

[case.expect]
exit_code = 0
stderr = ""
stdout = "'(abc)\n"

[[case]]
name = "raw leaked eq marker fails loud"
input = "W:\nS:\nO:abc@EQ«unterminated"

[case.expect]
exit_code = 2
stdout = ""
stderr = "parse error: unsupported or malformed Lisp input\n"

[[case]]
name = "raw leaked binding marker fails loud"
input = "W:\nS:\nO:abc@B:bad"

[case.expect]
exit_code = 2
stdout = ""
stderr = "parse error: unsupported or malformed Lisp input\n"

[[case]]
name = "raw plaintext output exits after write"
input = "W:\nS:\nO:abc"

[case.expect]
exit_code = 0
stderr = ""
stdout = "abc\n"

[[case]]
name = "raw protected left parenthesis output sentinel"
input = "W:\nS:\nO:§LP§"

[case.expect]
exit_code = 0
stderr = ""
stdout = "(\n"

[[case]]
name = "raw protected right parenthesis output sentinel"
input = "W:\nS:\nO:§RP§"

[case.expect]
exit_code = 0
stderr = ""
stdout = ")\n"

[[case]]
name = "raw dotted pair with two nested lists"
input = "W:\nS:\nO:((1 . nil) (2 . nil))"

[case.expect]
exit_code = 0
stderr = ""
stdout = "((1 . nil) . (2 . nil))\n"

[[case]]
name = "raw cons cell return through continuation"
input = "W:<C><N>1</N> <X/></C>\nE:@RET@\nF:\nB:\nS:\nO:"

[case.expect]
exit_code = 0
stderr = ""
stdout = "(1 . nil)\n"

[[case]]
name = "raw lambda return through continuation"
input = "W:<L><P>x</P><BODY>$x</BODY></L>\nE:@RET@\nF:\nB:\nS:\nO:"

[case.expect]
exit_code = 0
stderr = ""
stdout = "[lambda x]\n"

[[case]]
name = "raw lambda value returned from let frame"
input = "W:@LET<L><P>x</P><BODY>$x</BODY></L>@\nF:\nB:|x=1,\nS:\nO:"

[case.expect]
exit_code = 0
stderr = ""
stdout = "[lambda x]\n"

[[case]]
name = "raw nested let under continuation fails loud after rewrite"
input = "W:@LET{let {[y <N>2</N>]} $y}@\nE:@RET@\nF:\nB:\nS:\nO:"

[case.expect]
exit_code = 2
stdout = ""
stderr = "parse error: unsupported or malformed Lisp input\n"

[[case]]
name = "raw multi-parameter fallback fails loud after rewrite"
input = "W:{<L><P>a b c d e f</P><BODY>$f</BODY></L> <N>1</N> <N>2</N> <N>3</N> <N>4</N> <N>5</N> <N>6</N>}\nF:\nB:\nS:\nO:"

[case.expect]
exit_code = 2
stdout = ""
stderr = "parse error: unsupported or malformed Lisp input\n"
