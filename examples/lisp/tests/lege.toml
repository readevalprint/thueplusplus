program = "../lisp.tpp"
timeout = 5


[requires]
commands = ["bc"]

[[case]]
name = "le less"
input = "(le 3 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "le equal"
input = "(le 5 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "le greater"
input = "(le 7 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "ge greater"
input = "(ge 7 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge equal"
input = "(ge 5 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge less"
input = "(ge 3 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"
