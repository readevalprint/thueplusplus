program = "../lisp.tpp"
timeout = 5



[[case]]
name = "le less"
input = "(le 3 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "le equal"
input = "(le 5 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "le greater"
input = "(le 7 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "lt rational intermediates"
input = "(lt (/ 1 3) (/ 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "le rational intermediates equal"
input = "(le (/ 1 2) (/ 2 4))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge greater"
input = "(ge 7 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge equal"
input = "(ge 5 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge less"
input = "(ge 3 5)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "false"

[[case]]
name = "gt rational intermediates"
input = "(gt (/ 2 3) (/ 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "ge rational intermediates equal"
input = "(ge (/ 2 4) (/ 1 2))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
