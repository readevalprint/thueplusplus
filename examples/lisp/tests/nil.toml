program = "../lisp.tpp"
timeout = 5



[[case]]
name = "nil literal"
input = "nil"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "nil"

[[case]]
name = "empty list form"
input = "(list)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "nil"

[[case]]
name = "car nil guard"
input = "(car nil)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "nil"

[[case]]
name = "cdr nil guard"
input = "(cdr nil)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "nil"

[[case]]
name = "nil in cons"
input = "(cons 1 nil)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 . nil)"

[[case]]
name = "eq nil"
input = "(eq nil nil)"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"
