# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "100000"]

[[case]]
name = "eval list code with explicit primitive callable and binding"
input = "(write (unparse (eval (quote (add x 1)) (dict ((quote add) add) ((quote x) 10)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval generated list code"
input = "(write (unparse (eval (list (quote add) (quote x) 2) (dict ((quote add) add) ((quote x) 5)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "eval contains no hidden core env fallback"
input = "(eval (quote (add x 1)) (dict ((quote x) 10)))"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval contains no ambient caller env"
input = "(let ((x 99)) (eval (quote x) (dict)))"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval symbol get from explicit scope"
input = "(write (unparse (eval (quote x) (dict ((quote x) 42)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "eval scalar number self evaluates"
input = "(write (unparse (eval (quote 7) (dict))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "eval scalar bool self evaluates"
input = "(write (unparse (eval (quote true) (dict))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "eval string self evaluates not source"
input = "(write (unparse (eval \"(add 1 2)\" (dict ((quote add) add)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"(add 1 2)\""

[[case]]
name = "eval wrong arity none"
input = "(eval)"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval wrong arity one"
input = "(eval (quote x))"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval wrong arity extra"
input = "(eval (quote x) (dict ((quote x) 1)) (dict))"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval scope must be dict"
input = "(eval (quote x) 7)"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval alist code does not receive hidden scope"
input = "(eval (dict ((quote x) 1)) (dict))"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval closure value rejected"
input = "(eval (fn (x) x) (dict))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "exec remains unbound"
input = "exec"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval rejects string-key scope entries"
input = "(eval (quote x) (dict (\"x\" 1)))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval empty list code fails wrong arity"
input = "(eval (quote ()) (dict))"

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval symbol returning explicit primitive is unparseable at top level"
input = "(eval (quote add) (dict ((quote add) add)))"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "eval rejects operator symbol scope key"
input = "(eval (quote x) (assoc (dict) (quote +) 1))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval rejects operator symbol as code"
input = "(eval (quote +) (dict))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval directly evaluates nested list code without render reparse"
input = "(write (unparse (eval (quote (add (add x 1) 2)) (dict ((quote add) add) ((quote x) 10)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "eval generated list code with literal args"
input = "(write (unparse (eval (list (quote add) 1 2) (dict ((quote add) add)))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval direct generated list code keeps string data unparsed"
input = "(eval (list (quote eq) \"(add 1 2)\" \"(add 1 2)\") (dict ((quote eq) eq)))"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval accepts generated code returned with environment"
input = "(write (unparse (eval\n  (let ((code (quote (add x 1))))\n    code)\n  (dict ((quote add) add) ((quote x) 10)))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval accepts macroexpand result returned with environment"
input = "(write (unparse (eval\n  (let ((macros\n         (dict\n           ((quote inc)\n            (fn (args)\n              `(add ,(first args) 1))))))\n    (macroexpand (quote (inc x)) macros))\n  (dict ((quote add) add) ((quote x) 10)))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval accepts scope returned with environment"
input = "(write (unparse (eval\n  (quote (add x 1))\n  (let ((scope (dict ((quote add) add) ((quote x) 10))))\n    scope))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval rejects non-list scope returned with environment"
input = "(eval\n  (quote x)\n  (let ((scope 7))\n    scope))\n"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval code operand environment does not feed scope operand"
input = "(eval\n  (let ((scope (dict ((quote x) 1))))\n    (quote x))\n  scope)\n"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval macroexpand result still has no hidden core fallback"
input = "(eval\n  (let ((macros\n         (dict\n           ((quote inc)\n            (fn (args)\n              `(add ,(first args) 1))))))\n    (macroexpand (quote (inc x)) macros))\n  (dict ((quote x) 10)))\n"

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval rejects closure code returned with environment"
input = "(eval\n  (let ((code (fn (x) x)))\n    code)\n  (dict))\n"

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval explicit scope closure callable at top level"
input = "(write (unparse (let ((f (fn (n) n)))\n  (eval (quote (f 1))\n        (dict ((quote f) f))))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "eval explicit scope closure callable in nested argument"
input = "(write (unparse (let ((f (fn (n) n)))\n  (eval (quote (add (f 1) 2))\n        (dict ((quote add) add) ((quote f) f))))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval closure mutation does not clobber caller continuation env"
input = "(write (unparse (let ((secret 10)\n      (f (fn (x) (set secret (add secret x))))\n      (z 1))\n  (eval (quote (f 4))\n        (dict ((quote f) f) ((quote add) add)))\n  z)\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "eval explicit scope closure callee returned by nested call"
input = "(write (unparse (let ((make-add (fn () add)))\n  (eval (quote ((make-add) 1 2))\n        (dict ((quote make-add) make-add) ((quote add) add))))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval explicit scope closure mutation is sandboxed from caller env"
input = "(write (unparse (let ((secret 10)\n      (f (fn (x) (set secret (add secret x)))))\n  (list\n    (eval (quote (f 4))\n          (dict ((quote f) f) ((quote add) add)))\n    secret))\n))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(14 10)"
