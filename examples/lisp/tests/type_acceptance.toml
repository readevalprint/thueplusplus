# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 30
args = ["--eval-limit", "120000"]

[[case]]
name = "type reports number integer"
input = "(let () (write (unparse (type 1))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "number"

[[case]]
name = "type reports number rational"
input = "(let () (write (unparse (type 1/2))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "number"

[[case]]
name = "type reports booleans"
input = "(let () (write (unparse (list (type true) (type false)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "(boolean boolean)"

[[case]]
name = "type reports string"
input = "(let () (write (unparse (type \"hi\"))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "string"

[[case]]
name = "type reports quoted symbol"
input = "(let () (write (unparse (type (quote hello)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "symbol"

[[case]]
name = "type reports quoted list"
input = "(let () (write (unparse (type (quote (1 2))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "list"

[[case]]
name = "type reports constructed list"
input = "(let () (write (unparse (type (list 1 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "list"

[[case]]
name = "type reports dict helper result as list"
input = "(let () (write (unparse (type (dict (\"a\" 1))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "list"

[[case]]
name = "type reports closure as function"
input = "(let () (write (unparse (type (fn (x) x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "function"

[[case]]
name = "type reports existing builtin"
input = "(let () (write (unparse (type add))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "builtin"

[[case]]
name = "type reports itself as builtin"
input = "(let () (write (unparse (type type))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "builtin"

[[case]]
name = "type evaluates bound variables"
input = "(let () (write (unparse (let ((x \"hi\")) (type x)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "string"

[[case]]
name = "type evaluates computed values"
input = "(let () (write (unparse (type (add 1 2)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "number"

[[case]]
name = "type of quoted builtin name is symbol"
input = "(let () (write (unparse (type (quote add)))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "symbol"

[[case]]
name = "type missing fails through get"
input = "(type missing)"

[case.expect]
stdout = ""
stderr = "unbound_name\n"
exit_code = 2

[[case]]
name = "top-level type primitive is unparseable"
input = "type"

[case.expect]
exit_code = 0
stdout = ""
stderr = ""

[[case]]
name = "type requires one argument when extra arguments supplied"
input = "(type 1 2)"

[case.expect]
stdout = ""
stderr = "wrong_arity\n"
exit_code = 2

[[case]]
name = "type requires one argument through explicit eval apply"
input = "(eval (quote (type)) (dict ((quote type) type)))"

[case.expect]
stdout = ""
stderr = "wrong_arity\n"
exit_code = 2

[[case]]
name = "type works through explicit eval scope when provided"
input = "(let () (write (unparse (eval (quote (type xs)) (dict ((quote type) type) ((quote xs) (list 1 2)))))))"

[case.expect]
stderr = ""
exit_code = 0
stdout_stripped = "list"

[[case]]
name = "type absent from explicit eval scope is unbound"
input = "(eval (quote (type xs)) (dict ((quote xs) (list 1 2))))"

[case.expect]
stdout = ""
stderr = "unbound_name\n"
exit_code = 2
