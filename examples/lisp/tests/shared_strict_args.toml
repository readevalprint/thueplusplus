# SPDX-License-Identifier: AGPL-3.0-or-later
program = "../lisp.tpp"
timeout = 10
args = ["--eval-limit", "60000"]

[[case]]
name = "list evaluates args left-to-right with mutation"
input = "(write (unparse (let ((x 0)) (list (set x 1) x))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 1)"

[[case]]
name = "call evaluates args left-to-right with mutation"
input = "(write (unparse (let ((x 0)) ((fn (a b) (list a b)) (set x 1) x))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(1 1)"

[[case]]
name = "list retains empty-list direct behavior"
input = "(write (unparse (list)))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "()"

[[case]]
name = "zero arg closure call remains separate from empty list"
input = "(write (unparse ((fn () 7))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "strict collector propagates list argument type errors"
input = "(list (first 1) 2)"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "strict collector propagates call argument type errors"
input = "((fn (x) x) (first 1))"

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "type_error"

[[case]]
name = "quote does not use strict arg collector"
input = "(write (unparse (quote (first 1))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(first 1)"

[[case]]
name = "quasiquote does not use strict call collector"
input = "(write (unparse `((fn (x) x) (first 1))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((fn (x) x) (first 1))"

[[case]]
name = "dict still evaluates entry keys and values while preserving duplicates"
input = "(write (unparse (dict ((quote a) 1) ((quote a) 2))))"

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "((a 1) (a 2))"
