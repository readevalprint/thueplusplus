name = "mid raw substitution"
program = "../literal.thue"

[[case]]
name = "captured dot is a wildcard"
input = "pre=.\nx"

[case.expect]
stdout = "hit\n"
stderr = ""
exit_code = 0

[[case]]
name = "wildcard dot does not match a longer line"
input = "pre=.\naxc"

[case.expect]
stdout = ""
stderr = ""
exit_code = 2

[[case]]
name = "a captured backslash is inserted once"
input = "pre=\\\n$"

[case.expect]
stdout = "hit\n"
stderr = ""
exit_code = 0

[[case]]
name = "one backslash does not match a backslash line"
input = "pre=\\\n\\"

[case.expect]
stdout = ""
stderr = ""
exit_code = 2

[[case]]
name = "a captured parenthesis makes the filled regex invalid"
input = "pre=(\n("

[case.expect]
stdout = ""
exit_code = 1
stderr_contains = ["Invalid ::| regex '^($'"]
