name: cpp

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.6"
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install the C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libre2-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/gradle/wrapper/gradle-wrapper.properties
      - name: Run conformance, including the C++ host
        env:
          # Same stretch the Rust workflow uses. A heavy Lisp case misses
          # the 10s budget on a GitHub-hosted core. Local make test leaves
          # this unset.
          THUE_TIMEOUT_SCALE: "2"
        run: make test
