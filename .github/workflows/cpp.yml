name: cpp

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libre2-dev
      - name: Run conformance, including the C++ host
        # A lisp case can sit near the 10s cap. Four hosts at the runner's
        # internal parallelism sometimes push the Go host over that cap.
        # Retry the same make test once; a real mismatch fails both times.
        run: make test || make test
