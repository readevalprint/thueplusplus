name: metrics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the pull request base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Check latest.json and archived benches
        run: uv run python metrics/check_history.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Check solution and interpreter acceptance
        run: uv run python metrics/accept.py --base "${{ github.event.pull_request.base.sha }}"
