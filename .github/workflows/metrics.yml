name: metrics

on:
  push:
    branches: [main]
    paths-ignore:
      - metrics/history.json

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/cache@v4
        with:
          path: |
            build/go-thuepp
            build/thuepp.wasm
          key: hosts-${{ hashFiles('go/**/*.go', 'go/go.mod', 'go/go.sum') }}
      - name: Install the C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libre2-dev
      - name: Record metrics for this commit
        run: uv run python metrics/record.py
      - name: Commit the history file
        run: |
          git add metrics/history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "metrics: record ${GITHUB_SHA}"
          git push
