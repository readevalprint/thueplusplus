include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: '$CI_SERVER_HOST != "gitlab.com"'
  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: '$CI_SERVER_HOST != "gitlab.com"'

stages:
  - test
  - secret-detection

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.cache/rustup"
  SECRET_DETECTION_ENABLED: "true"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv/
    - .cache/go-build/
    - .cache/go-mod/
    - .cache/cargo/
    - .cache/rustup/
    - demo/.npm/

test:
  image: golang:1.24.6-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  before_script:
    - mkdir -p "$UV_CACHE_DIR" "$GOCACHE" "$GOMODCACHE" /tmp/uv-bin
    - |
      if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh \
          | env UV_INSTALL_DIR=/tmp/uv-bin INSTALLER_NO_MODIFY_PATH=1 sh -s -- --no-modify-path
        export PATH="/tmp/uv-bin:$PATH"
      fi
    - uv --version
    - go version
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential cmake pkg-config libre2-dev
    - g++ --version
    - |
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain 1.83.0 --profile minimal
      fi
      export PATH="$CARGO_HOME/bin:$PATH"
      rustc --version
    - |
      if ! command -v node >/dev/null 2>&1; then
        curl -fsSL https://nodejs.org/dist/v22.21.0/node-v22.21.0-linux-x64.tar.xz -o /tmp/node.tar.xz
        tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      fi
      node --version
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - make test

tasks:
  image: golang:1.24.6-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
    - if: '$CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - go version
    - command -v timeout
    - apt-get update
    - apt-get install -y --no-install-recommends python3
  script:
    - make problems
    - make langs
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/problems/results.json
      - build/langs/results.json

e2e:
  image: node:22-bookworm
  needs:
    - job: tasks
      artifacts: true
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl make
    - |
      case "$(uname -m)" in
        x86_64) GO_ARCH=amd64 ;;
        aarch64|arm64) GO_ARCH=arm64 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://go.dev/dl/go1.24.6.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tgz
      tar -C /usr/local -xzf /tmp/go.tgz
      export PATH="/usr/local/go/bin:$PATH"
      go version
    - node --version
    - npm --version
    - npm --prefix demo ci
    - npx --prefix demo playwright install --with-deps chromium
  script:
    - export PATH="/usr/local/go/bin:$PATH"
    - npm --prefix demo run test:e2e

# Grammar tests and the installable extension package. The job does not publish.
vscode:
  image: node:22-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  script:
    - node --version
    - npm --version
    - npm --prefix editors/vscode ci
    - npm --prefix editors/vscode test
    - npm --prefix editors/vscode run package
    - test -s editors/vscode/thue-0.5.0.vsix
  artifacts:
    expire_in: 14 days
    paths:
      - editors/vscode/*.vsix
