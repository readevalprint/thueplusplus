include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: '$CI_SERVER_HOST != "gitlab.com"'
  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: '$CI_SERVER_HOST != "gitlab.com"'

stages:
  - test
  - pages
  - secret-detection

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  SECRET_DETECTION_ENABLED: "true"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv/
    - .cache/go-build/
    - .cache/go-mod/
    - demo/.npm/

test:
  image: golang:1.24.6-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  before_script:
    - mkdir -p "$UV_CACHE_DIR" "$GOCACHE" "$GOMODCACHE" /tmp/uv-bin
    - |
      if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh \
          | env UV_INSTALL_DIR=/tmp/uv-bin INSTALLER_NO_MODIFY_PATH=1 sh -s -- --no-modify-path
        export PATH="/tmp/uv-bin:$PATH"
      fi
    - uv --version
    - go version
  script:
    - make test

tasks:
  image: golang:1.24.6-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  before_script:
    - mkdir -p "$UV_CACHE_DIR" "$GOCACHE" "$GOMODCACHE" /tmp/uv-bin
    - |
      if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh \
          | env UV_INSTALL_DIR=/tmp/uv-bin INSTALLER_NO_MODIFY_PATH=1 sh -s -- --no-modify-path
        export PATH="/tmp/uv-bin:$PATH"
      fi
    - uv --version
    - go version
  script:
    - make tasks
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/tasks/results.json

e2e:
  image: node:22-bookworm
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.com"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl make
    - |
      case "$(uname -m)" in
        x86_64) GO_ARCH=amd64 ;;
        aarch64|arm64) GO_ARCH=arm64 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://go.dev/dl/go1.24.6.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tgz
      tar -C /usr/local -xzf /tmp/go.tgz
      export PATH="/usr/local/go/bin:$PATH"
      go version
    - node --version
    - npm --version
    - npm --prefix demo ci
    - npx --prefix demo playwright install --with-deps chromium
  script:
    - export PATH="/usr/local/go/bin:$PATH"
    - npm --prefix demo run test:e2e

# Publishes the demo as the thuelang.org site. Known routes are real
# index.html files. Unknown paths use 404.html, a copy of the SPA shell.
# vercel.json stays the preview config and is not used here.
pages:
  image: node:22-bookworm
  stage: pages
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl make
    - |
      case "$(uname -m)" in
        x86_64) GO_ARCH=amd64 ;;
        aarch64|arm64) GO_ARCH=arm64 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://go.dev/dl/go1.24.6.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tgz
      tar -C /usr/local -xzf /tmp/go.tgz
      export PATH="/usr/local/go/bin:$PATH"
      go version
    - node --version
    - npm --version
  script:
    - export PATH="/usr/local/go/bin:$PATH"
    - make demo-build
    - rm -rf public
    - cp -R demo/dist public
    - |
      for path in \
        public/index.html \
        public/404.html \
        public/playground/index.html \
        public/embed/index.html \
        public/embed/demo/index.html \
        public/thuepp.wasm
      do
        test -s "$path" || { echo "GitLab Pages site is missing $path" >&2; exit 1; }
      done
      cmp -s public/404.html public/index.html || { echo "public/404.html must match public/index.html" >&2; exit 1; }
      grep -q 'https://thuelang.org/playground' public/playground/index.html
      grep -q 'src="/assets/' public/playground/index.html
  artifacts:
    paths:
      - public
