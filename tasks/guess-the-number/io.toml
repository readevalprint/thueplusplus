# Guest-agnostic transcript. The runner binds the guest interpreter and the solution.
name = "guess-the-number"
timeout = 30
args = ["--max-steps", "200000", "--max-evals", "2000000", "--max-state-bytes", "2097152"]

stdin = """
42
10
80
42
"""

[expect]
exit_code = 0
stdout = """
Player 1, enter the secret:
Player 2, enter a guess:
Too low.
Player 2, enter a guess:
Too high.
Player 2, enter a guess:
Correct.
"""
stderr = ""
