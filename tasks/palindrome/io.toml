# Guest-agnostic transcript. The runner binds the guest interpreter and the solution.
name = "palindrome"
timeout = 30
args = ["--max-steps", "50000", "--max-evals", "3000000", "--max-state-bytes", "2097152"]

[[case]]
name = "zero"
stdin = """
0
"""

[case.expect]
exit_code = 0
stdout = """
true
"""
stderr = ""

[[case]]
name = "seven"
stdin = """
7
"""

[case.expect]
exit_code = 0
stdout = """
true
"""
stderr = ""

[[case]]
name = "ten"
stdin = """
10
"""

[case.expect]
exit_code = 0
stdout = """
false
"""
stderr = ""

[[case]]
name = "one-two-one"
stdin = """
121
"""

[case.expect]
exit_code = 0
stdout = """
true
"""
stderr = ""
