# Guest languages implemented as Thue++ programs. make tasks feeds each
# solution to that program as --input and runs it on the native Go host.

[[guest]]
id = "forth"
program = "examples/forth/forth.thue"
extension = "fth"

[[guest]]
id = "lisp"
program = "examples/lisp/lisp.thue"
extension = "lisp"

[[guest]]
id = "brainfuck"
program = "examples/brainfuck/brainfuck.thue"
extension = "bf"

[[guest]]
id = "basic"
program = "examples/basic/basic.thue"
extension = "bas"
