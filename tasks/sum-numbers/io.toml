# Guest-agnostic transcript. The runner binds the guest interpreter and the solution.
name = "sum-numbers"
timeout = 30
args = ["--max-steps", "50000", "--max-evals", "3000000", "--max-state-bytes", "2097152"]

[[case]]
name = "three"
stdin = """
3
10
20
30
"""

[case.expect]
exit_code = 0
stdout = """
60
"""
stderr = ""

[[case]]
name = "none"
stdin = """
0
"""

[case.expect]
exit_code = 0
stdout = """
0
"""
stderr = ""

[[case]]
name = "one"
stdin = """
1
5
"""

[case.expect]
exit_code = 0
stdout = """
5
"""
stderr = ""
