[package]
name = "thuelang"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Thue++ interpreter: ordered regex rewrites over one state string"
license = "MIT"
repository = "https://github.com/thuelang/thueplusplus"
homepage = "https://thuelang.org"
readme = "README.md"

[lib]
name = "thuelang"
path = "src/lib.rs"

[[bin]]
name = "thue"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
