[package]
name = "thuepp"
version = "0.5.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "Thue++ interpreter: ordered regex rewrites over one state string"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.22"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
