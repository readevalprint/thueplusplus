# Explicit-scope code-as-data eval acceptance.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "100000"]

[[case]]
name = "eval list code with explicit primitive callable and binding"
input = '(eval (quote (add x 1)) (dict ((quote add) add) ((quote x) 10)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval generated list code"
input = '(eval (list (quote add) (quote x) 2) (dict ((quote add) add) ((quote x) 5)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "eval contains no hidden core env fallback"
input = '(eval (quote (add x 1)) (dict ((quote x) 10)))'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval contains no ambient caller env"
input = '(let ((x 99)) (eval (quote x) (dict)))'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval symbol get from explicit scope"
input = '(eval (quote x) (dict ((quote x) 42)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "42"

[[case]]
name = "eval scalar number self evaluates"
input = '(eval (quote 7) (dict))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "7"

[[case]]
name = "eval scalar bool self evaluates"
input = '(eval (quote true) (dict))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "true"

[[case]]
name = "eval string self evaluates not source"
input = '(eval "(add 1 2)" (dict ((quote add) add)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "\"(add 1 2)\""

[[case]]
name = "eval wrong arity none"
input = '(eval)'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval wrong arity one"
input = '(eval (quote x))'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval wrong arity extra"
input = '(eval (quote x) (dict ((quote x) 1)) (dict))'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval scope must be dict"
input = '(eval (quote x) 7)'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval alist code does not receive hidden scope"
input = '(eval (dict ((quote x) 1)) (dict))'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval closure value rejected"
input = '(eval (fn (x) x) (dict))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "exec remains unbound"
input = 'exec'

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval rejects string-key scope entries"
input = '(eval (quote x) (dict ("x" 1)))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval empty list code fails wrong arity"
input = '(eval (quote ()) (dict))'

[case.expect]
exit_code = 2
stderr = "wrong_arity\n"
stdout_stripped = ""

[[case]]
name = "eval symbol returning explicit primitive is unparseable at top level"
input = '(eval (quote add) (dict ((quote add) add)))'

[case.expect]
exit_code = 2
stderr = "unparseable_value\n"
stdout_stripped = ""

[[case]]
name = "eval rejects operator symbol scope key"
input = '(eval (quote x) (assoc (dict) (quote +) 1))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval rejects operator symbol as code"
input = '(eval (quote +) (dict))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval directly evaluates nested list code without render reparse"
input = '(eval (quote (add (add x 1) 2)) (dict ((quote add) add) ((quote x) 10)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "13"

[[case]]
name = "eval generated list code with literal args"
input = '(eval (list (quote add) 1 2) (dict ((quote add) add)))'

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval direct generated list code keeps string data unparsed"
input = '(eval (list (quote eq) "(add 1 2)" "(add 1 2)") (dict ((quote eq) eq)))'

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval accepts generated code returned with environment"
input = '''
(eval
  (let ((code (quote (add x 1))))
    code)
  (dict ((quote add) add) ((quote x) 10)))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval accepts macroexpand result returned with environment"
input = '''
(eval
  (let ((macros
         (dict
           ((quote inc)
            (fn (args)
              `(add ,(first args) 1))))))
    (macroexpand (quote (inc x)) macros))
  (dict ((quote add) add) ((quote x) 10)))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval accepts scope returned with environment"
input = '''
(eval
  (quote (add x 1))
  (let ((scope (dict ((quote add) add) ((quote x) 10))))
    scope))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "11"

[[case]]
name = "eval rejects non-list scope returned with environment"
input = '''
(eval
  (quote x)
  (let ((scope 7))
    scope))
'''

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""

[[case]]
name = "eval code operand environment does not feed scope operand"
input = '''
(eval
  (let ((scope (dict ((quote x) 1))))
    (quote x))
  scope)
'''

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval macroexpand result still has no hidden core fallback"
input = '''
(eval
  (let ((macros
         (dict
           ((quote inc)
            (fn (args)
              `(add ,(first args) 1))))))
    (macroexpand (quote (inc x)) macros))
  (dict ((quote x) 10)))
'''

[case.expect]
exit_code = 2
stderr = "unbound_name\n"
stdout_stripped = ""

[[case]]
name = "eval rejects closure code returned with environment"
input = '''
(eval
  (let ((code (fn (x) x)))
    code)
  (dict))
'''

[case.expect]
exit_code = 2
stderr = "type_error\n"
stdout_stripped = ""


[[case]]
name = "eval explicit scope closure callable at top level"
input = '''
(let ((f (fn (n) n)))
  (eval (quote (f 1))
        (dict ((quote f) f))))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"

[[case]]
name = "eval explicit scope closure callable in nested argument"
input = '''
(let ((f (fn (n) n)))
  (eval (quote (add (f 1) 2))
        (dict ((quote add) add) ((quote f) f))))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval closure mutation does not clobber caller continuation env"
input = '''
(let ((secret 10)
      (f (fn (x) (set secret (add secret x))))
      (z 1))
  (eval (quote (f 4))
        (dict ((quote f) f) ((quote add) add)))
  z)
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "1"


[[case]]
name = "eval explicit scope closure callee returned by nested call"
input = '''
(let ((make-add (fn () add)))
  (eval (quote ((make-add) 1 2))
        (dict ((quote make-add) make-add) ((quote add) add))))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "3"

[[case]]
name = "eval explicit scope closure mutation is sandboxed from caller env"
input = '''
(let ((secret 10)
      (f (fn (x) (set secret (add secret x)))))
  (list
    (eval (quote (f 4))
          (dict ((quote f) f) ((quote add) add)))
    secret))
'''

[case.expect]
exit_code = 0
stderr = ""
stdout_stripped = "(14 10)"
