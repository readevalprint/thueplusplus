# Edge acceptance cases for currently supported Lisp behavior.
# These cases pin hard-won edge semantics in examples/lisp/lisp.tpp.
program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "60000"]

[[case]]
name = "top-level empty list renders as reader syntax"
input = '(list)'

[case.expect]
exit_code = 0
stdout_stripped = "()"
stderr = ""

[[case]]
name = "empty list first errors"
input = '(first (list))'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "empty_list"

[[case]]
name = "singleton list rest is empty"
input = '(rest (list 7))'

[case.expect]
exit_code = 0
stdout_stripped = "()"
stderr = ""

[[case]]
name = "nested let shadowing"
input = '(let ((x 1)) (let ((x 2)) x))'

[case.expect]
exit_code = 0
stdout_stripped = "2"
stderr = ""

[[case]]
name = "closure captures outer binding after later shadow"
input = '(let ((x 10)) (let ((f (fn (y) (add x y)))) (let ((x 99)) (f 5))))'

[case.expect]
exit_code = 0
stdout_stripped = "15"
stderr = ""

[[case]]
name = "apply fn from list first"
input = '((first (list (fn (x) (add x 10)))) 5)'

[case.expect]
exit_code = 0
stdout_stripped = "15"
stderr = ""

[[case]]
name = "nary and short circuits after false"
input = '(and true false (div 1 0))'

[case.expect]
exit_code = 0
stdout_stripped = "false"
stderr = ""

[[case]]
name = "nary or returns first truthy value"
input = '(or false false 9)'

[case.expect]
exit_code = 0
stdout_stripped = "9"
stderr = ""

[[case]]
name = "lazy if string protects syntax"
input = '(if true "not (code) [x]" (div 1 0))'

[case.expect]
exit_code = 0
stdout_stripped = "\"not (code) [x]\""
stderr = ""

[[case]]
name = "rational addition"
input = '(add 1/2 1/3)'

[case.expect]
exit_code = 0
stdout_stripped = "5/6"
stderr = ""

[[case]]
name = "unbound name inside addition errors"
input = '(add x 1)'

[case.expect]
exit_code = 2
stdout = ""
stderr_stripped = "unbound_name"

