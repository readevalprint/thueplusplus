program = "../lisp.tpp"
timeout = 10
args = ["--max-evals", "200000"]

[[case]]
name = "symbol constructs ordinary symbol from name string"
input = '(symbol "x")'
[case.expect]
stdout = "x\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol constructs operator symbol from string"
input = '(symbol "<=")'
[case.expect]
stdout = "<=\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol is idempotent for symbol input"
input = '(symbol (quote x))'
[case.expect]
stdout = "x\n"
stderr = ""
exit_code = 0

[[case]]
name = "name returns source spelling for ordinary symbol"
input = '(name (quote x))'
[case.expect]
stdout = "\"x\"\n"
stderr = ""
exit_code = 0

[[case]]
name = "name returns source spelling for operator symbol"
input = '(name (quote <=))'
[case.expect]
stdout = "\"<=\"\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol output round trips through unparse and parse"
input = '(parse (unparse (symbol "x")))'
[case.expect]
stdout = "x\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol callable can be passed as value"
input = '(type symbol)'
[case.expect]
stdout = "builtin\n"
stderr = ""
exit_code = 0

[[case]]
name = "name callable can be passed as value"
input = '(type name)'
[case.expect]
stdout = "builtin\n"
stderr = ""
exit_code = 0

[[case]]
name = "symbol rejects missing argument"
input = '(symbol)'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "symbol rejects extra argument"
input = '(symbol "x" "y")'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "name rejects missing argument"
input = '(name)'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "name rejects extra argument"
input = '(name (quote x) (quote y))'
[case.expect]
stdout = ""
stderr_stripped = "wrong_arity"
exit_code = 2

[[case]]
name = "symbol rejects non symbolable values"
input = '(symbol 1)'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "symbol rejects list values"
input = '(symbol (list 1))'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "name rejects strings"
input = '(name "x")'
[case.expect]
stdout = ""
stderr_stripped = "type_error"
exit_code = 2

[[case]]
name = "symbol rejects invalid string spelling with space"
input = '(symbol "has space")'
[case.expect]
stdout = ""
stderr_stripped = "invalid_symbol"
exit_code = 2

[[case]]
name = "symbol rejects boolean spellings to preserve parse unparse type"
input = '(symbol "true")'
[case.expect]
stdout = ""
stderr_stripped = "invalid_symbol"
exit_code = 2

[[case]]
name = "symbol rejects numeric spellings to preserve parse unparse type"
input = '(symbol "1/1")'
[case.expect]
stdout = ""
stderr_stripped = "invalid_symbol"
exit_code = 2
