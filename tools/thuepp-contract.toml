# Static thue++ executable-contract slices.
# This file is test-enforced only; interpreters do not generate runtime code from it.

[implementations.python]
available = true
command = "uv run python python/thuepp.py"
notes = "Current Python implementation; invoked by shared manifests as an external command."

[implementations.go]
available = true
command = "go build ./cmd/thuepp"
notes = "Current Go implementation; built once and invoked by shared manifests as an external command."

[implementations.javascript]
available = false
command = ""
notes = "No JavaScript implementation exists yet; future JS work must join the shared manifest runner."

[builtins.eq]
arity = 2
category = "string"
notes = "Exact byte/string equality; returns 1 for equal, 0 otherwise."

[builtins.add]
arity = 2
category = "numeric"
notes = "Exact rational addition over the canonical numeric input grammar."

[builtins.sub]
arity = 2
category = "numeric"
notes = "Exact rational subtraction over the canonical numeric input grammar."

[builtins.mul]
arity = 2
category = "numeric"
notes = "Exact rational multiplication over the canonical numeric input grammar."

[builtins.div]
arity = 2
category = "numeric"
notes = "Exact rational division; division by zero fails loudly."

[builtins.mod]
arity = 2
category = "numeric"
notes = "Modulo over non-negative integer operands; zero divisor, decimals, fractions, and negatives fail loudly."

[builtins.numeq]
arity = 2
category = "numeric"
notes = "Exact rational numeric equality; returns 1 for equal, 0 otherwise."

[builtins.lt]
arity = 2
category = "numeric"
notes = "Exact rational less-than comparison; returns 1 for true, 0 otherwise."

[builtins.le]
arity = 2
category = "numeric"
notes = "Exact rational less-than-or-equal comparison; returns 1 for true, 0 otherwise."

[builtins.gt]
arity = 2
category = "numeric"
notes = "Exact rational greater-than comparison; returns 1 for true, 0 otherwise."

[builtins.ge]
arity = 2
category = "numeric"
notes = "Exact rational greater-than-or-equal comparison; returns 1 for true, 0 otherwise."

[builtins.num]
arity = 1
category = "numeric"
notes = "Canonicalizes one numeric input into a readable <num>...</num> typed value."

[builtins.b64enc]
arity = 1
category = "string"
notes = "UTF-8 text to unpadded Base64url."

[builtins.b64dec]
arity = 1
category = "string"
notes = "Canonical unpadded Base64url to UTF-8 text; padding, invalid characters, impossible lengths, invalid UTF-8, and non-canonical encodings fail loudly."
