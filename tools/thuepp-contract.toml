# thue++ executable-contract slices.
# Shared tooling reads implementation entries from this file; interpreters do not
# generate runtime code from it.

[implementations.python]
available = true
command = "uv run python python/thuepp.py"
notes = "Current Python implementation; invoked by shared manifests as an external command."

[implementations.go]
available = true
build = "go build -o {artifact} ./cmd/thuepp"
build_workdir = "go"
command = "{artifact}"
notes = "Current Go implementation; built once from go/ and invoked by shared manifests as an external command."
