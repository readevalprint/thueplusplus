# One inline table per host. Adding a host is one line in this array.
# `command` is split with shell quoting and run from the repository root.
# `build`, when set, runs first. `cwd` is relative to the repository root.
# `build_env` and `env` are space-separated KEY=VALUE pairs. A value that
# contains a slash is resolved from the repository root.
# `timeout_scale` and `timeout_floor` stretch that host's case timeout.

host = [
  { id = "python", command = "uv run thue" },
  { id = "go", command = "build/go-thue", build = "go build -o ../build/go-thue ./cmd/thue", cwd = "go" },
  { id = "js", command = "node js/src/cli.js", build = "npm ci", cwd = "js" },
  { id = "wasm", command = "node wasm/src/cli.js", build = "go build -o ../build/thue.wasm ./cmd/thue-wasm", cwd = "go", build_env = "GOOS=js GOARCH=wasm CGO_ENABLED=0", env = "THUE_WASM=build/thue.wasm", timeout_scale = 8, timeout_floor = 30 },
  { id = "rust", command = "rust/target/release/thue", build = "cargo build --release --manifest-path rust/Cargo.toml" },
  { id = "cpp", command = "build/cpp/thue", build = "make cpp" },
  { id = "ruby", command = "ruby/exe/thue", build = "make ruby" },
  { id = "csharp", command = "build/csharp/thue", build = "dotnet publish csharp/src/Thuelang.Cli/Thuelang.Cli.csproj -c Release -o build/csharp --nologo" },
  { id = "java", command = "java/build/install/thue/bin/thue", build = "./gradlew --no-daemon installDist", cwd = "java" },
]
